<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLANALTO: simulador da Presidência (ficção)</title>
  <style>
/* Planalto Brasil — sistema visual (redesenho 0.16).
   Paleta própria: azul-noite institucional, verde-bandeira suave e ouro de destaque.
   As classes e variáveis existentes foram mantidas para preservar o comportamento. */
:root {
  --fundo: #0b1220;
  --fundo-2: #0f1a2b;
  --painel: #142033;
  --painel-alto: #1a2940;
  --linha: #26364f;
  --linha-forte: #3a4f6d;
  --texto: #e7edf6;
  --suave: #93a4bc;
  --destaque: #e8b84a;
  --destaque-suave: rgba(232, 184, 74, 0.14);
  --verde: #3fae7f;
  --verde-suave: rgba(63, 174, 127, 0.16);
  --vermelho: #e0665e;
  --vermelho-suave: rgba(224, 102, 94, 0.14);
  --azul: #5b8ee6;
  --sombra: 0 10px 30px rgba(0, 0, 0, 0.28);
  --raio: 12px;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 10% -10%, #15284a 0%, transparent 60%),
              radial-gradient(900px 500px at 110% 0%, #14302a 0%, transparent 55%),
              var(--fundo);
  color: var(--texto);
  font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* Cabeçalho */
.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  padding: 12px 24px;
  background: rgba(11, 18, 32, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--linha);
}
.topo strong {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--texto); font-size: 15px; font-weight: 700; letter-spacing: .16em;
}
.topo strong::before {
  content: ""; width: 26px; height: 26px; border-radius: 8px;
  background: linear-gradient(135deg, var(--destaque), #c58a1c);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.15);
}
.topo .aviso { flex: 1 1 260px; }
.topo button { margin: 0; padding: 6px 12px; font-size: 13px; background: transparent; border-color: var(--linha-forte); }
.topo button:hover:not(:disabled) { background: var(--painel-alto); }
.aviso { color: var(--suave); font-size: 13px; }

/* Área principal */
main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 40px; }
h1, h2 { margin: .15em 0 .5em; letter-spacing: -.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 {
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
  color: var(--destaque); display: flex; align-items: center; gap: 8px;
}
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--linha-forte), transparent); }

/* Cartões */
.painel {
  background: linear-gradient(180deg, var(--painel-alto) 0%, var(--painel) 100%);
  border: 1px solid var(--linha);
  border-radius: var(--raio);
  padding: 18px 20px;
  margin-bottom: 18px;
  box-shadow: var(--sombra);
  transition: border-color .2s ease;
}
.painel:hover { border-color: var(--linha-forte); }
.grade { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .grade { grid-template-columns: 1fr; } }

/* Indicadores (cartões de números) */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 4px; }
.indicadores div {
  background: var(--fundo-2); border: 1px solid var(--linha); border-radius: 10px;
  padding: 12px 14px; position: relative; overflow: hidden;
}
.indicadores div::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--azul); }
.indicadores div span { display: block; color: var(--suave); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.indicadores div b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }

/* Botões */
button {
  background: var(--painel-alto); color: var(--texto);
  border: 1px solid var(--linha-forte); border-radius: 8px;
  padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 500;
  margin: 3px 6px 3px 0;
  transition: background .15s ease, border-color .15s ease, transform .05s ease;
}
button:hover:not(:disabled) { border-color: var(--destaque); background: #213452; }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primario {
  background: linear-gradient(180deg, #f0c25a, #d9a330); color: #1a1407;
  border-color: #e0b04a; font-weight: 700; box-shadow: 0 6px 18px rgba(232,184,74,.22);
}
button.primario:hover:not(:disabled) { background: linear-gradient(180deg, #f5cb6e, #e2aa3a); }
button.perigo { background: transparent; color: var(--vermelho); border-color: rgba(224,102,94,.6); }
button.perigo:hover:not(:disabled) { background: var(--vermelho-suave); border-color: var(--vermelho); }
button[aria-pressed="true"] { background: var(--destaque-suave); border-color: var(--destaque); color: var(--destaque); }

/* Campos */
input, select, textarea {
  background: var(--fundo-2); color: var(--texto);
  border: 1px solid var(--linha-forte); border-radius: 8px;
  padding: 9px 11px; font: inherit; width: 100%; margin-bottom: 12px;
}
input:focus, select:focus, textarea:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 3px rgba(91,142,230,.25); }
label { display: block; color: var(--suave); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
.botao-arquivo { border-radius: 8px; }

/* Mapa */
.mapa { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.uf {
  border: 1px solid var(--linha); border-radius: 7px; padding: 8px 2px;
  text-align: center; cursor: pointer; background: #17263b; color: var(--texto);
  font-size: 12px; font-weight: 700; margin: 0; transition: transform .12s ease, border-color .12s ease;
}
.uf:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--destaque); background: #1d3049; }
.uf small { display: block; font-size: 10px; font-weight: 500; color: var(--suave); margin-top: 2px; }
.uf.sel { outline: 2px solid var(--destaque); outline-offset: 1px; }

/* Barras de pesquisa */
.barra { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
.barra .nome { width: 150px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra .trilho { flex: 1; background: var(--fundo-2); border-radius: 999px; height: 10px; overflow: hidden; border: 1px solid var(--linha); }
.barra .preench { background: linear-gradient(90deg, #2c8c66, var(--verde)); height: 100%; border-radius: 999px; transition: width .4s ease; }
.barra.eu .preench { background: linear-gradient(90deg, #c58a1c, var(--destaque)); }
.barra .valor { width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; }

/* Registros */
.log { max-height: 280px; overflow: auto; font-size: 13px; }
.log div { border-bottom: 1px solid var(--linha); padding: 7px 2px; }
.log span {
  display: inline-block; min-width: 42px; color: var(--azul); font-size: 11px; font-weight: 700;
  margin-right: 8px; background: rgba(91,142,230,.12); padding: 1px 6px; border-radius: 999px; text-align: center;
}
.msg { color: var(--vermelho); min-height: 1.4em; font-size: 14px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { color: var(--suave); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--linha-forte); }
td { border-bottom: 1px solid var(--linha); padding: 8px 8px; }
tr:hover td { background: rgba(255,255,255,.02); }
.vencedor { font-size: 24px; font-weight: 700; color: var(--destaque); margin: 6px 0 16px; }
.tabela-rolavel { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.topo-tela { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.topo-tela h1 { margin: 0; }

/* Estados de foco e acessibilidade */
:focus-visible { outline: 3px solid var(--destaque); outline-offset: 2px; }
.msg { min-height: 1.4em; }
[data-contraste="alto"] {
  --fundo: #000; --fundo-2: #000; --painel: #000; --painel-alto: #000; --linha: #fff; --linha-forte: #fff;
  --texto: #fff; --suave: #e0e0e0; --destaque: #ffe600; --verde: #00ff9c; --vermelho: #ff6b6b; --azul: #6fb3ff;
}
[data-contraste="alto"] button, [data-contraste="alto"] input, [data-contraste="alto"] select { border-width: 2px; }
[data-contraste="alto"] .painel, [data-contraste="alto"] .uf { border-width: 2px; }
[data-contraste="alto"] .painel { box-shadow: none; }

/* Celular e telas pequenas */
html { -webkit-text-size-adjust: 100%; }
@media (max-width: 600px) {
  main { padding: 14px 12px 28px; }
  .topo { gap: 8px; padding: 10px 12px; }
  .topo button { font-size: 13px; padding: 6px 8px; }
  h1 { font-size: 21px; }
  .painel { padding: 14px; }
  .indicadores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .indicadores div b { font-size: 18px; }
  .mapa { gap: 3px; }
  .uf { font-size: 11px; padding: 6px 1px; }
  .uf small { font-size: 9px; }
  .barra .nome { width: 110px; font-size: 12px; }
  button { font-size: 14px; padding: 9px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---- Redesenho 0.17: apresentação, navegação por áreas e painel presidencial ---- */
[id^="sec-"] { scroll-margin-top: 84px; }
.hero {
  padding: 26px 26px 22px; margin-bottom: 18px; border-radius: 14px;
  background: radial-gradient(700px 260px at 0% 0%, rgba(232,184,74,.18), transparent 60%),
              linear-gradient(135deg, #1a2d4e 0%, #13223a 60%, #112a26 100%);
  border: 1px solid var(--linha-forte); box-shadow: var(--sombra);
}
.hero-titulo { font-size: 34px; letter-spacing: -.02em; margin: 2px 0 6px; }
.eyebrow { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--destaque); font-weight: 700; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.feature { background: rgba(11,18,32,.55); border: 1px solid var(--linha); border-radius: 10px; padding: 12px 14px; }
.feature b { display: block; font-size: 20px; color: var(--texto); }
.feature span { color: var(--suave); font-size: 13px; }

.areas { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; padding: 10px; background: var(--fundo-2); border: 1px solid var(--linha); border-radius: 12px; }
.chip {
  display: inline-flex; align-items: center; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--linha-forte); color: var(--texto); text-decoration: none; font-size: 13px; font-weight: 600;
  background: var(--painel-alto);
}
.chip:hover { border-color: var(--destaque); color: var(--destaque); }

.cabecalho-painel { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cabecalho-painel h1 { margin: 0; }
.pill {
  display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
  letter-spacing: .04em; color: var(--azul); background: rgba(91,142,230,.14); border: 1px solid rgba(91,142,230,.35);
}

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
.kpi {
  background: var(--fundo-2); border: 1px solid var(--linha); border-radius: 12px; padding: 14px;
  display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--azul); }
.kpi.destaque::before { background: linear-gradient(90deg, #c58a1c, var(--destaque)); }
.kpi span { color: var(--suave); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.kpi b { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi small { font-size: 12px; }
.tend { font-size: 12px; font-weight: 700; }
.tend.alta { color: var(--verde); }
.tend.queda { color: var(--vermelho); }
.tend.neutra { color: var(--suave); font-weight: 500; }

.duas-colunas { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 860px) { .duas-colunas { grid-template-columns: 1fr; } }
.lista { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.lista li { padding: 8px 2px; border-bottom: 1px solid var(--linha); }
.lista li:last-child { border-bottom: 0; }
.lista li span {
  display: inline-block; min-width: 46px; margin-right: 8px; text-align: center;
  font-size: 11px; font-weight: 700; color: var(--azul); background: rgba(91,142,230,.12); border-radius: 999px; padding: 1px 6px;
}

/* Sala de guerra eleitoral — painel analítico com resultados derivados do motor. */
.sala-guerra { border-color: rgba(91,142,230,.45); background: linear-gradient(145deg, rgba(22,38,62,.98), rgba(16,27,44,.98)); }
.sala-guerra > p { max-width: 900px; }
.war-legend { display:flex; gap:18px; flex-wrap:wrap; color:var(--suave); font-size:12px; margin:10px 0 16px; }
.war-legend span { display:inline-flex; align-items:center; gap:7px; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; }
.dot-gold { background:var(--destaque); }
.dot-blue { background:var(--azul); }
.war-table { display:grid; gap:8px; }
.war-row { display:grid; grid-template-columns:minmax(145px,1.05fr) minmax(180px,2fr) 92px 102px; gap:14px; align-items:center; padding:12px; background:rgba(7,13,23,.34); border:1px solid var(--linha); border-radius:10px; }
.war-name { display:flex; gap:9px; align-items:center; min-width:0; }
.war-name b { overflow-wrap:anywhere; }
.war-rank { display:grid; place-items:center; width:25px; height:25px; flex:0 0 25px; border-radius:8px; color:var(--suave); background:var(--painel-alto); font-size:11px; }
.war-bars { min-width:0; }
.war-track { height:9px; border-radius:999px; background:#0a1220; overflow:hidden; border:1px solid var(--linha); }
.war-fill { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#426db5,var(--azul)); }
.war-fill.war-you { background:linear-gradient(90deg,#b77e21,var(--destaque)); }
.war-bars small { display:block; margin-top:5px; color:var(--suave); font-size:11px; }
.war-prob { text-align:right; }
.war-prob b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
.war-prob small { display:block; color:var(--suave); font-size:10px; }
.war-bottom { margin-top:16px; }
.war-stat { background:rgba(7,13,23,.34); border:1px solid var(--linha); border-radius:10px; padding:14px; }
.war-stat > span { display:block; color:var(--suave); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
.war-stat > b { display:block; font-size:24px; margin:6px 0; }
.war-stat .lista { margin-top:6px; }
.war-stat .lista li span { min-width:48px; }
@media (max-width: 760px) {
  .war-row { grid-template-columns:minmax(0,1fr) auto; gap:9px 12px; }
  .war-name { grid-column:1 / -1; }
  .war-bars { grid-column:1 / -1; }
  .war-prob { text-align:left; }
}

/* Tela inicial 0.18: composição editorial em duas colunas, com percurso de jogo explícito. */
.inicio-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(270px,.75fr); gap:18px; align-items:stretch; }
.inicio-form { margin-bottom:18px; padding:24px; }
.inicio-form h1 { font-size:25px; margin-bottom:8px; }
.inicio-aside { margin-bottom:18px; background:linear-gradient(160deg,rgba(26,41,64,.96),rgba(14,25,41,.98)); }
.inicio-aside h2 { margin-top:6px; }
.inicio-aside h2::after { display:none; }
.inicio-etapas { list-style:none; margin:18px 0; padding:0; counter-reset:etapa; }
.inicio-etapas li { position:relative; counter-increment:etapa; padding:0 0 18px 42px; margin:0; border-left:1px solid var(--linha-forte); }
.inicio-etapas li:last-child { border-left-color:transparent; padding-bottom:0; }
.inicio-etapas li::before { content:counter(etapa, decimal-leading-zero); position:absolute; left:-1px; top:0; transform:translateX(-50%); display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--linha-forte); border-radius:9px; background:var(--fundo-2); color:var(--destaque); font-size:11px; font-weight:800; }
.inicio-etapas b, .inicio-etapas span { display:block; }
.inicio-etapas b { font-size:14px; margin-bottom:4px; }
.inicio-etapas span { color:var(--suave); font-size:12px; line-height:1.55; }
.inicio-nota { padding:13px; border:1px solid rgba(63,174,127,.3); border-radius:10px; background:var(--verde-suave); }
.inicio-nota b, .inicio-nota span { display:block; }
.inicio-nota b { color:var(--verde); font-size:12px; margin-bottom:4px; }
.inicio-nota span { color:var(--suave); font-size:12px; }
@media (max-width: 860px) { .inicio-grid { grid-template-columns:1fr; gap:0; } .inicio-aside { order:2; } .inicio-form { order:1; } }


/* Beta 0.19 — governo menos poluído: áreas operacionais recolhidas até serem abertas. */
.secao-governo { margin: 12px 0; border: 1px solid var(--linha); border-radius: 10px; background: rgba(15,26,43,.72); overflow: hidden; }
.secao-governo > summary { cursor: pointer; list-style: none; padding: 14px 16px; font-weight: 700; color: var(--texto); display: flex; align-items: center; gap: 10px; }
.secao-governo > summary::-webkit-details-marker { display: none; }
.secao-governo > summary::before { content: '+'; color: var(--destaque); font-size: 20px; line-height: 1; }
.secao-governo[open] > summary::before { content: '−'; }
.secao-governo[open] > summary { border-bottom: 1px solid var(--linha); }
.secao-governo > .painel, .secao-governo > .grade { margin: 12px; }
.secao-governo .painel { box-shadow: none; }


/* Beta 0.19 — governo menos poluído: áreas operacionais recolhidas até serem abertas. */
.secao-governo { margin: 12px 0; border: 1px solid var(--linha); border-radius: 10px; background: rgba(15,26,43,.72); overflow: hidden; }
.secao-governo > summary { cursor: pointer; list-style: none; padding: 14px 16px; font-weight: 700; color: var(--texto); display: flex; align-items: center; gap: 10px; }
.secao-governo > summary::-webkit-details-marker { display: none; }
.secao-governo > summary::before { content: '+'; color: var(--destaque); font-size: 20px; line-height: 1; }
.secao-governo[open] > summary::before { content: '−'; }
.secao-governo[open] > summary { border-bottom: 1px solid var(--linha); }
.secao-governo > .painel, .secao-governo > .grade { margin: 12px; }
.secao-governo .painel { box-shadow: none; }


/* Beta 0.20 — prévia do despacho presidencial */
.acoes-medida { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 14px; }
.acoes-medida button { margin:0; }
.previsao-medida { border:1px solid var(--linha-forte); border-radius:12px; padding:16px; margin:14px 0; background:linear-gradient(150deg, rgba(91,142,230,.10), rgba(63,174,127,.07)); }
.previsao-topo { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.previsao-medida h3 { font-size:17px; margin:12px 0; line-height:1.4; }
.previsao-grade { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:12px 0; }
.previsao-grade > div { border:1px solid var(--linha); border-radius:8px; padding:10px 12px; background:rgba(8,15,27,.42); min-width:0; }
.previsao-grade span { display:block; font-size:11px; color:var(--suave); text-transform:uppercase; letter-spacing:.04em; }
.previsao-grade b { display:block; margin-top:4px; overflow-wrap:anywhere; }
@media(max-width:600px) { .previsao-grade { grid-template-columns:1fr; } .acoes-medida { align-items:stretch; flex-direction:column; } .acoes-medida button { width:100%; } }

/* Votação nominal: nomes reais, votos estritamente simulados */
.medida-registro { padding:12px 0; border-bottom:1px solid var(--linha); overflow-wrap:anywhere; }
.votacao-nominal { margin:10px 0; border:1px solid var(--linha); border-radius:8px; overflow:hidden; }
.votacao-nominal summary { cursor:pointer; padding:10px 12px; background:var(--fundo-2); color:var(--texto); font-size:13px; }
.lista-votos { max-height:330px; overflow:auto; padding:6px 12px; }
.voto-nominal { display:grid; grid-template-columns:minmax(0,1fr) auto 44px; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid rgba(147,164,188,.12); font-size:12px; }
.voto-nominal span { overflow-wrap:anywhere; }
.voto-nominal small { color:var(--suave); }
.voto-nominal b { text-align:center; }
.voto-sim { color:var(--verde); }
.voto-nao { color:var(--vermelho); }

  <script id="jogo-bundle">
// ---- src/motor/rng.js ----
const rng = (() => {
// Gerador pseudoaleatório determinístico (mulberry32).
// Com a mesma semente, a partida reproduz exatamente os mesmos resultados.
function criarRng(seed) {
  let a = seed >>> 0;
  return function proximo() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

return { criarRng };
})();

// ---- src/motor/percentuais.js ----
const percentuais = (() => {
// Converte pesos em percentuais inteiros que somam exatamente o total.
// Método do maior resto: cada item recebe a parte inteira e as unidades
// restantes vão para os maiores restos fracionários (empate: ordem de chave).
function distribuirPercentuais(pesos, total = 100) {
  const chaves = Object.keys(pesos);
  if (chaves.length === 0) throw new Error('Nenhum item para distribuir');
  for (const k of chaves) {
    const v = pesos[k];
    if (typeof v !== 'number' || !Number.isFinite(v) || v < 0) {
      throw new Error(`Peso inválido para "${k}": ${v}`);
    }
  }
  const soma = chaves.reduce((s, k) => s + pesos[k], 0);
  if (soma <= 0) throw new Error('A soma dos pesos precisa ser maior que zero');

  const brutos = chaves.map((k) => ({ k, bruto: (pesos[k] / soma) * total }));
  const resultado = {};
  let usado = 0;
  for (const b of brutos) {
    resultado[b.k] = Math.floor(b.bruto);
    usado += resultado[b.k];
  }
  const sobra = total - usado;
  const porResto = [...brutos].sort(
    (x, y) => (y.bruto - Math.floor(y.bruto)) - (x.bruto - Math.floor(x.bruto)) ||
      (x.k < y.k ? -1 : x.k > y.k ? 1 : 0)
  );
  for (let i = 0; i < sobra; i++) resultado[porResto[i].k] += 1;
  return resultado;
}

return { distribuirPercentuais };
})();

// ---- src/motor/apuracao.js ----
const apuracao = (() => {
// Apuração eleitoral. Recebe votos por estado e calcula totais, percentuais
// sobre votos válidos, vencedor do 1º turno (mais de 50% dos válidos) e,
// se necessário, os dois finalistas do 2º turno.
//
// Entrada:
//   estados: [{ uf: 'SP', votos: { [idCandidato]: inteiro >= 0 } }]
//   ids: lista de identificadores válidos de candidatos
function apurar(estados, ids) {
  if (!Array.isArray(ids) || ids.length < 2) {
    throw new Error('A apuração precisa de pelo menos dois candidatos');
  }
  const conjunto = new Set(ids);
  if (conjunto.size !== ids.length) throw new Error('Identificadores duplicados');

  const totais = Object.fromEntries(ids.map((id) => [id, 0]));
  const ufsVistas = new Set();
  for (const estado of estados) {
    if (ufsVistas.has(estado.uf)) throw new Error(`UF repetida: ${estado.uf}`);
    ufsVistas.add(estado.uf);
    for (const [id, qtd] of Object.entries(estado.votos)) {
      if (!conjunto.has(id)) throw new Error(`Candidato desconhecido em ${estado.uf}: ${id}`);
      if (!Number.isInteger(qtd) || qtd < 0) {
        throw new Error(`Votação inválida em ${estado.uf} para ${id}: ${qtd}`);
      }
      totais[id] += qtd;
    }
  }

  const validos = ids.reduce((s, id) => s + totais[id], 0);
  if (validos === 0) throw new Error('Nenhum voto válido apurado');

  const percentuais = Object.fromEntries(
    ids.map((id) => [id, (totais[id] / validos) * 100])
  );

  // Vitória no 1º turno exige mais da metade dos votos válidos.
  const liderId = ids.reduce((a, b) => (totais[b] > totais[a] ? b : a));
  const vencedorPrimeiroTurno = totais[liderId] * 2 > validos ? liderId : null;

  let segundoTurno = null;
  if (vencedorPrimeiroTurno === null) {
    const ordenados = [...ids].sort((a, b) => totais[b] - totais[a] || (a < b ? -1 : 1));
    segundoTurno = [ordenados[0], ordenados[1]];
  }

  return {
    validos,
    totais,
    percentuais,
    vencedorPrimeiroTurno,
    segundoTurno,
    porEstado: estados.map((e) => ({
      uf: e.uf,
      vencedor: ids.reduce((a, b) => ((e.votos[b] ?? 0) > (e.votos[a] ?? 0) ? b : a)),
    })),
  };
}

return { apurar };
})();

// ---- src/motor/campanha.js ----
const campanha = (() => {
// Motor da campanha presidencial: 13 semanas, pesquisas, debates, denúncias e apuração.
// Funções puras: cada ação devolve um novo estado. Tudo é reproduzível pela semente.
const { criarRng } = rng;
const { distribuirPercentuais } = percentuais;
const { apurar } = apuracao;
const { ESTADOS } = estados;
const { GOVERNADORES } = governadores;

const SEMANAS = 13;
const ENERGIA_MAX = 10;
const SEMANAS_DEBATE = [4, 8, 12];
const INDECISOS = 'indecisos';
// Parâmetros de calibragem do equilíbrio. Valores padrão são os usados no jogo.
const PARAMS = {
  comicioGanho: 6,        // pontos por comício (decai com repetições na mesma UF)
  caminhadaGanho: 3,      // pontos por caminhada
  redeFator: 0.04,        // fator da rede social (x peso do estado)
  debateTecnica: 1.5,
  debateEmocional: 0.15,
  debateAtaqueAcerta: 0.4,
  debateAtaqueErra: -0.25,
  contraAtaque: 2.25,     // força base da reação do líder adversário, por estado
  deriva: 3,              // pontos que adversários ganham por sorteio semanal
  derivaSorteios: 8,      // quantos sorteios de deriva por semana
  probDenuncia: 0.08,
  aliancaGanho: 4,       // pontos ganhos ao fechar aliança com candidato a governador
  aliancaSemanal: 0.3,    // pontos por semana enquanto a aliança durar
  saturacao: 1,           // rendimento decrescente: quanto mais apoio, mais difícil crescer (0 = desligado)
};
// Modos de dificuldade: sobrescrevem PARAMS apenas para a partida escolhida.
// Recursos e base do jogador também mudam com a dificuldade (normal = valores originais).
const DIFICULDADES = {
  facil: {
    contraAtaque: 0.6, deriva: 0, probDenuncia: 0.04,
    comicioGanho: 9, caminhadaGanho: 4.5, redeFator: 0.06,
    baseJogador: 12, caixaInicial: 100, caixaSemanal: 12, energiaMax: 12, custoMult: 0.8,
  },
  normal: {
    contraAtaque: 2.25, deriva: 3, probDenuncia: 0.08,
    comicioGanho: 18, caminhadaGanho: 3, redeFator: 0.16,
    baseJogador: 8, caixaInicial: 60, caixaSemanal: 10, energiaMax: 10, custoMult: 1,
  },
  dificil: {
    contraAtaque: 2.6, deriva: 4, probDenuncia: 0.12,
    comicioGanho: 6, caminhadaGanho: 3, redeFator: 0.04,
    baseJogador: 6, caixaInicial: 50, caixaSemanal: 7, energiaMax: 9, custoMult: 1.1,
  },
};
// Parâmetros da partida: guardados no estado. Saves antigos recebem os valores padrão do normal.
function pm(s) {
  return { ...PARAMS, ...DIFICULDADES.normal, ...(s.params ?? {}) };
}
const BASE_JOGADOR = 8;
const BASE_ADVERSARIO = 10;
const BASE_INDECISOS = 5;
const BASE_BRANCOS_NULOS = 10;
const REFERENCIA_QUAEST = { lula: 39, flavio: 34, augusto: 4, caiado: 4, renan: 3, zema: 1 };
const CHAVE_BRANCOS_NULOS = 'brancos_nulos';
const CAIXA_INICIAL = 60;
const CAIXA_SEMANAL = 8;
const CUSTOS = {
  comicio: { energia: 3, caixa: 12 },
  caminhada: { energia: 2, caixa: 4 },
  rede: { energia: 1, caixa: 3 },
  debate: { energia: 2, caixa: 0 },
  responder: { energia: 2, caixa: 5 },
  alianca: { energia: 2, caixa: 10 },
};
const ESTILOS_DEBATE = ['tecnica', 'emocional', 'ataque'];
const UFS = new Set(ESTADOS.map((e) => e.uf));
const PESO_TOTAL = ESTADOS.reduce((s, e) => s + e.peso, 0);

// Sorteio reproduzível: cada chamada usa um índice diferente do estado.
function sortear(state) {
  state.contador += 1;
  return criarRng((state.seed + state.contador * 2654435761) >>> 0)();
}

function validarUf(uf) {
  if (!UFS.has(uf)) throw new Error(`UF inválida: ${uf}`);
}

// Move pontos de um candidato para o destino. Primeiro vêm dos indecisos,
// depois dos demais, proporcionalmente. A soma da linha não muda.
function mover(linha, valor, destino, saturacao = 0) {
  if (valor <= 0) return 0;
  // Saturação: o candidato que já tem muito apoio no estado ganha menos com novos pontos.
  if (destino === 'jogador' && saturacao > 0) {
    const total = Object.values(linha).reduce((t, v) => t + v, 0);
    const parcela = total > 0 ? linha.jogador / total : 0;
    valor *= Math.max(0.15, 1 - saturacao * parcela);
  }
  let ganho = 0;
  const doIndecisos = Math.min(linha[INDECISOS], valor);
  linha[INDECISOS] -= doIndecisos;
  ganho += doIndecisos;
  const falta = valor - doIndecisos;
  const outros = Object.keys(linha).filter((k) => k !== INDECISOS && k !== CHAVE_BRANCOS_NULOS && k !== destino);
  const totalOutros = outros.reduce((s, k) => s + linha[k], 0);
  if (falta > 0 && totalOutros > 0) {
    const tirar = Math.min(falta, totalOutros);
    for (const k of outros) linha[k] -= tirar * (linha[k] / totalOutros);
    ganho += tirar;
  }
  linha[destino] += ganho;
  return ganho;
}

// Perde pontos do jogador para os indecisos (denúncia, ataque mal recebido).
function perder(linha, valor) {
  const tirar = Math.min(valor, linha.jogador);
  linha.jogador -= tirar;
  linha[INDECISOS] += tirar;
}

// Aplica um ganho (ou perda) do jogador em todos os estados, proporcional ao peso.
function espalhar(state, fator) {
  for (const e of ESTADOS) {
    const linha = state.apoio[e.uf];
    const valor = fator * e.peso;
    if (valor >= 0) mover(linha, valor, 'jogador', pm(state).saturacao);
    else perder(linha, -valor);
  }
}

function gastar(s, tipo) {
  const c = CUSTOS[tipo];
  // Mesmo cálculo de custoDaAcao: o que a tela mostra é exatamente o que é cobrado.
  const custoCaixa = custoDaAcao(s, tipo).caixa;
  if (s.energia < c.energia) throw new Error('Energia insuficiente nesta semana');
  if (s.caixa < custoCaixa) throw new Error('Caixa insuficiente para esta ação');
  s.energia -= c.energia;
  s.caixa -= custoCaixa;
}

function acao(state, tipo, fn) {
  if (state.fase !== 'campanha') throw new Error('A campanha já terminou');
  const s = structuredClone(state);
  gastar(s, tipo);
  const texto = fn(s);
  s.eventos.push({ semana: s.semana, tipo, texto });
  return s;
}

function criarPartida({ seed, jogador, adversarios, dificuldade = 'normal' }) {
  if (!Number.isInteger(seed)) throw new Error('Semente inválida');
  if (!Object.prototype.hasOwnProperty.call(DIFICULDADES, dificuldade)) {
    throw new Error(`Dificuldade inválida: ${dificuldade}`);
  }
  const nome = (jogador?.nome ?? '').trim();
  if (!nome) throw new Error('Informe o nome do candidato');
  if (nome.length > 60) throw new Error('Nome muito longo (máximo de 60 caracteres)');
  if (!Array.isArray(adversarios) || adversarios.length < 1) throw new Error('Sem adversários');
  const ids = ['jogador', ...adversarios.map((a) => a.id)];
  if (new Set(ids).size !== ids.length || ids.includes(INDECISOS)) {
    throw new Error('Identificadores de candidatos duplicados ou reservados');
  }
  const candidatos = [
    { id: 'jogador', nome, partido: jogador.partido ?? 'Sem partido', vice: (jogador.vice ?? '').trim() || null },
    ...adversarios.map((a) => ({ id: a.id, nome: a.nome, partido: a.partido, vice: a.vice ?? null })),
  ];
  const apoio = {};
  // Base calibrada pela Quaest divulgada em 28/09/2026 (n=2.004, margem ±2 p.p.).
  // A candidatura personalizada recebe a base de jogo definida pela dificuldade; os percentuais
  // dos nomes medidos são proporcionalmente ajustados para manter o total em 100%.
  const pesosBase = {};
  for (const a of adversarios) {
    const n = String(a.nome ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const sigla = String(a.partido ?? '').toUpperCase();
    let valor = 0.0;
    if (/lula/.test(n) || sigla === 'PT') valor = REFERENCIA_QUAEST.lula;
    else if (/flavio/.test(n) || sigla === 'PL') valor = REFERENCIA_QUAEST.flavio;
    else if (/augusto/.test(n) || sigla === 'AVANTE') valor = REFERENCIA_QUAEST.augusto;
    else if (/caiado/.test(n) || sigla === 'PSD') valor = REFERENCIA_QUAEST.caiado;
    else if (/renan/.test(n) || sigla === 'MISSÃO') valor = REFERENCIA_QUAEST.renan;
    else if (/zema/.test(n) || sigla === 'NOVO') valor = REFERENCIA_QUAEST.zema;
    pesosBase[a.id] = valor;
  }
  const somaBase = Object.values(pesosBase).reduce((t, v) => t + v, 0) || 1;
  const nomeJogador = String(nome).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const partidoJogador = String(jogador.partido ?? '').toUpperCase();
  let baseJogador = DIFICULDADES[dificuldade].baseJogador;
  if (/lula/.test(nomeJogador) && partidoJogador === 'PT') baseJogador = REFERENCIA_QUAEST.lula;
  else if (/flavio/.test(nomeJogador) && partidoJogador === 'PL') baseJogador = REFERENCIA_QUAEST.flavio;
  else if (/augusto/.test(nomeJogador) && partidoJogador === 'AVANTE') baseJogador = REFERENCIA_QUAEST.augusto;
  else if (/caiado/.test(nomeJogador) && partidoJogador === 'PSD') baseJogador = REFERENCIA_QUAEST.caiado;
  else if (/renan/.test(nomeJogador) && partidoJogador === 'MISSÃO') baseJogador = REFERENCIA_QUAEST.renan;
  else if (/zema/.test(nomeJogador) && partidoJogador === 'NOVO') baseJogador = REFERENCIA_QUAEST.zema;
  const disponivel = 100 - baseJogador - BASE_INDECISOS - BASE_BRANCOS_NULOS;
  for (const e of ESTADOS) {
    const linha = { jogador: baseJogador, [INDECISOS]: BASE_INDECISOS, [CHAVE_BRANCOS_NULOS]: BASE_BRANCOS_NULOS };
    for (const a of adversarios) linha[a.id] = (pesosBase[a.id] / somaBase) * disponivel;
    apoio[e.uf] = linha;
  }
  return {
    versao: 1, seed, dificuldade, params: { ...PARAMS, ...DIFICULDADES[dificuldade] },
    contador: 0, semana: 1, energia: DIFICULDADES[dificuldade].energiaMax, caixa: DIFICULDADES[dificuldade].caixaInicial,
    fase: 'campanha', candidatos, apoio, comicios: {}, debates: {}, escandaloPendente: false,
    eventos: [], pesquisas: [], aliancas: {}, resultado: null,
  };
}

// Custo real de uma ação na partida (depende da dificuldade).
function custoDaAcao(state, tipo) {
  const c = CUSTOS[tipo];
  if (!c) throw new Error(`Ação desconhecida: ${tipo}`);
  return { energia: c.energia, caixa: Math.round(c.caixa * (pm(state).custoMult ?? 1)) };
}

function comicio(state, uf) {
  validarUf(uf);
  return acao(state, 'comicio', (s) => {
    const n = s.comicios[uf] ?? 0;
    s.comicios[uf] = n + 1;
    const ganho = mover(s.apoio[uf], pm(s).comicioGanho / (1 + n), 'jogador', pm(s).saturacao);
    return `Comício em ${uf}: +${ganho.toFixed(1)} pontos`;
  });
}

function caminhada(state, uf) {
  validarUf(uf);
  return acao(state, 'caminhada', (s) => {
    const n = s.comicios[uf] ?? 0;
    s.comicios[uf] = n + 1;
    const ganho = mover(s.apoio[uf], pm(s).caminhadaGanho / (1 + n), 'jogador', pm(s).saturacao);
    return `Caminhada em ${uf}: +${ganho.toFixed(1)} pontos`;
  });
}

function redeSocial(state) {
  return acao(state, 'rede', (s) => {
    espalhar(s, pm(s).redeFator);
    return 'Publicação nas redes sociais: alcance nacional';
  });
}

function debate(state, estilo) {
  if (!ESTILOS_DEBATE.includes(estilo)) throw new Error(`Estilo de debate inválido: ${estilo}`);
  if (!SEMANAS_DEBATE.includes(state.semana)) throw new Error('Não há debate nesta semana');
  if (state.debates[state.semana]) throw new Error('Debate desta semana já realizado');
  return acao(state, 'debate', (s) => {
    s.debates[s.semana] = estilo;
    if (estilo === 'tecnica') {
      espalhar(s, pm(s).debateTecnica);
      return 'Debate: resposta técnica, com números e prazos';
    }
    if (estilo === 'emocional') {
      espalhar(s, pm(s).debateEmocional);
      if (sortear(s) < 0.2) {
        espalhar(s, -pm(s).debateEmocional);
        return 'Debate: resposta emotiva foi vista como evasiva';
      }
      return 'Debate: resposta emotiva bem recebida';
    }
    if (sortear(s) < 0.5) {
      espalhar(s, pm(s).debateAtaqueAcerta);
      return 'Debate: ataque certeiro ao adversário';
    }
    espalhar(s, pm(s).debateAtaqueErra);
    return 'Debate: ataque saiu pela culatra';
  });
}

// Aliança com um candidato a governador do estado (registros do TSE 2026).
// Um estado tem no máximo uma aliança: escolher outro candidato substitui a anterior.
function alianca(state, uf, candidatoId) {
  validarUf(uf);
  const candidatos = GOVERNADORES[uf] ?? [];
  const escolhido = candidatos.find((c) => c.id === candidatoId);
  if (!escolhido) throw new Error(`Candidato a governador não encontrado em ${uf}`);
  return acao(state, 'alianca', (s) => {
    s.aliancas = s.aliancas ?? {};
    s.aliancas[uf] = { id: escolhido.id, nome: escolhido.nome, partido: escolhido.partido, desde: s.semana };
    const ganho = mover(s.apoio[uf], pm(s).aliancaGanho, 'jogador', pm(s).saturacao);
    return `Aliança em ${uf} com ${escolhido.nome} (${escolhido.partido}): +${ganho.toFixed(1)} pontos`;
  });
}

function candidatosGovernador(uf) {
  validarUf(uf);
  return GOVERNADORES[uf] ?? [];
}

function responderDenuncia(state) {
  if (!state.escandaloPendente) throw new Error('Não há denúncia pendente');
  return acao(state, 'responder', (s) => {
    s.escandaloPendente = false;
    espalhar(s, 0.1);
    return 'Resposta à denúncia: transparência e documentos';
  });
}

function encerrarSemana(state) {
  if (state.fase !== 'campanha') throw new Error('A campanha já terminou');
  const s = structuredClone(state);
  s.caixa += pm(s).caixaSemanal;
  s.energia = pm(s).energiaMax;
  // Adversários ganham terreno de forma moderada, em estados sorteados.
  const adversarios = s.candidatos.slice(1);
  for (let i = 0; i < pm(s).derivaSorteios; i++) {
    const a = adversarios[Math.floor(sortear(s) * adversarios.length)];
    const e = ESTADOS[Math.floor(sortear(s) * ESTADOS.length)];
    mover(s.apoio[e.uf], pm(s).deriva, a.id);
  }
  // O adversário mais forte nas pesquisas faz campanha nos três maiores estados.
  const pesq = pesquisaNacional(s);
  const lider = adversarios.reduce((m, c) => ((pesq[c.id] ?? 0) > (pesq[m.id] ?? 0) ? c : m), adversarios[0]);
  // Reage ao jogador: ataca os estados onde ele tem mais votos, com força maior
  // quanto mais à frente ele estiver na pesquisa nacional.
  const vantagem = Math.max(0, (pesq.jogador ?? 0) - (pesq[lider.id] ?? 0));
  const forca = pm(s).contraAtaque * (1 + vantagem / 5);
  const alvos = [...ESTADOS]
    .sort((x, y) => (s.apoio[y.uf].jogador * y.peso) - (s.apoio[x.uf].jogador * x.peso))
    .slice(0, 5);
  for (const e of alvos) mover(s.apoio[e.uf], forca, lider.id);
  // Denúncia: pode acontecer uma vez por vez, e exige resposta.
  if (!s.escandaloPendente && sortear(s) < pm(s).probDenuncia) {
    s.escandaloPendente = true;
    for (let i = 0; i < 2; i++) {
      const e = ESTADOS[Math.floor(sortear(s) * ESTADOS.length)];
      perder(s.apoio[e.uf], 4);
    }
    s.eventos.push({ semana: s.semana, tipo: 'denuncia', texto: 'Denúncia com repercussão nacional' });
  }
  // Alianças estaduais mantêm um apoio semanal pequeno enquanto durarem.
  for (const uf of Object.keys(s.aliancas ?? {})) {
    if (s.apoio[uf]) mover(s.apoio[uf], pm(s).aliancaSemanal, 'jogador', pm(s).saturacao);
  }
  // Pesquisa da semana, com o instituto de rotação.
  if (!s.pesquisas) s.pesquisas = [];
  s.pesquisas.push(realizarPesquisa(s, INSTITUTOS[(s.semana - 1) % INSTITUTOS.length]));
  s.semana += 1;
  if (s.semana > SEMANAS) s.fase = 'votacao';
  return s;
}

// Percentuais inteiros (somam 100) por estado, incluindo indecisos.
function pesquisaUf(state, uf) {
  validarUf(uf);
  return distribuirPercentuais(state.apoio[uf], 100);
}

// Intenção "verdadeira" nacional em números fracionários (somam 100).
function pesquisaNacionalFloat(state) {
  const acum = Object.fromEntries(Object.keys(state.apoio[ESTADOS[0].uf]).map((k) => [k, 0]));
  for (const e of ESTADOS) {
    const linha = state.apoio[e.uf];
    const soma = Object.values(linha).reduce((t, v) => t + v, 0);
    for (const k of Object.keys(linha)) acum[k] += (linha[k] / soma) * 100 * e.peso;
  }
  for (const k of Object.keys(acum)) acum[k] /= PESO_TOTAL;
  return acum;
}

// Intenção nacional arredondada (inteiros que somam 100): usada como referência.
function pesquisaNacional(state) {
  return distribuirPercentuais(pesquisaNacionalFloat(state), 100);
}

// Margem de erro (em pontos percentuais) para uma proporção p (0 a 1) com amostra n.
function margemDeErro(p, n) {
  return 1.96 * Math.sqrt((p * (1 - p)) / n) * 100;
}

// Institutos com amostra e viés próprios. Os valores são FICTÍCIOS (viés em pontos
// percentuais, aplicado ao candidato do jogador). Não são de institutos reais.
const INSTITUTOS = [
  { nome: 'Quaest (base 28/09/2026)', n: 2004, vies: 0.0 },
  { nome: 'Instituto simulado A', n: 2000, vies: 0.4 },
  { nome: 'Instituto simulado B', n: 1800, vies: -0.3 },
  { nome: 'Instituto simulado C', n: 2200, vies: 0.1 },
];

// Realiza uma pesquisa com amostragem: cada entrevistado escolhe uma opção
// conforme a intenção real (com viés do instituto). O resultado tem erro de amostra.
function realizarPesquisa(s, instituto) {
  const ids = [...s.candidatos.map((c) => c.id), INDECISOS, CHAVE_BRANCOS_NULOS];
  const base = pesquisaNacionalFloat(s);
  const prob = { ...base };
  prob.jogador = Math.max(0, prob.jogador + instituto.vies);
  prob[INDECISOS] = Math.max(0, prob[INDECISOS] - instituto.vies);
  const total = ids.reduce((t, id) => t + prob[id], 0);

  const contagem = Object.fromEntries(ids.map((id) => [id, 0]));
  for (let i = 0; i < instituto.n; i++) {
    const r = sortear(s) * total;
    let acc = 0;
    let escolhido = ids[ids.length - 1];
    for (const id of ids) {
      acc += prob[id];
      if (r < acc) { escolhido = id; break; }
    }
    contagem[escolhido] += 1;
  }
  const resultados = distribuirPercentuais(contagem, 100);
  const pJogador = contagem.jogador / instituto.n;
  return {
    semana: s.semana,
    instituto: instituto.nome,
    n: instituto.n,
    resultados,
    margemJogador: Math.round(margemDeErro(pJogador, instituto.n) * 10) / 10,
    referencia: 'Quaest/CNN Brasil, campo 24–27/09/2026, registro TSE BR-06520/2026',
    referencia: 'Quaest/CNN Brasil, campo 24–27/09/2026, registro TSE BR-06520/2026',
  };
}

// Média das últimas três pesquisas publicadas (como um agregador de pesquisas).
function mediaPesquisas(state, ultimas = 3) {
  const lista = (state.pesquisas ?? []).slice(-ultimas);
  if (lista.length === 0) return null;
  const soma = {};
  for (const pesq of lista) {
    for (const [id, v] of Object.entries(pesq.resultados)) soma[id] = (soma[id] ?? 0) + v;
  }
  for (const id of Object.keys(soma)) soma[id] /= lista.length;
  return distribuirPercentuais(soma, 100);
}

// Pesos de voto: indecisos se distribuem entre os decididos, com ruído pequeno.
function pesosDeVoto(s, linha, ids) {
  const decididos = ids.reduce((t, id) => t + (linha[id] ?? 0), 0);
  const ind = linha[INDECISOS] ?? 0;
  const pesos = {};
  for (const id of ids) {
    const base = decididos > 0
      ? (linha[id] ?? 0) + (ind * (linha[id] ?? 0)) / decididos
      : 1;
    pesos[id] = Math.max(0, base) * (0.9 + 0.2 * sortear(s));
  }
  if (Object.values(pesos).every((v) => v === 0)) for (const id of ids) pesos[id] = 1;
  return pesos;
}

function votosDoEstado(peso, pct) {
  const pesoInt = Math.round(peso * 1000);
  return Object.fromEntries(Object.entries(pct).map(([id, p]) => [id, pesoInt * p]));
}

function eleger(state) {
  if (state.fase !== 'votacao') throw new Error('A votação só ocorre depois da campanha');
  const s = structuredClone(state);
  const ids = s.candidatos.map((c) => c.id);
  const nomes = Object.fromEntries(s.candidatos.map((c) => [c.id, c.nome]));

  const estados1 = ESTADOS.map((e) => {
    const pct = distribuirPercentuais(pesosDeVoto(s, s.apoio[e.uf], ids), 100);
    return { uf: e.uf, votos: votosDoEstado(e.peso, pct) };
  });
  const r1 = apurar(estados1, ids);
  let r2 = null;
  let vencedor = r1.vencedorPrimeiroTurno;

  if (vencedor === null) {
    const [a, b] = r1.segundoTurno;
    const estados2 = ESTADOS.map((e) => {
      const linha = { [a]: s.apoio[e.uf][a], [b]: s.apoio[e.uf][b], [INDECISOS]: s.apoio[e.uf][INDECISOS] };
      const pct = distribuirPercentuais(pesosDeVoto(s, linha, [a, b]), 100);
      return { uf: e.uf, votos: votosDoEstado(e.peso, pct) };
    });
    r2 = apurar(estados2, [a, b]);
    // Empate absoluto no 2º turno: decide o primeiro da lista do 1º turno.
    vencedor = r2.totais[a] >= r2.totais[b] ? a : b;
  }

  s.resultado = {
    vencedor,
    nomeVencedor: nomes[vencedor],
    primeiroTurno: { totais: r1.totais, percentuais: r1.percentuais, validos: r1.validos, porEstado: r1.porEstado },
    segundoTurno: r2 ? { finalistas: r1.segundoTurno, totais: r2.totais, porEstado: r2.porEstado } : null,
  };
  s.fase = 'encerrada';
  s.eventos.push({ semana: SEMANAS, tipo: 'eleicao', texto: `Resultado: ${nomes[vencedor]} venceu` });
  return s;
}

return { SEMANAS, ENERGIA_MAX, SEMANAS_DEBATE, INDECISOS, PARAMS, DIFICULDADES, criarPartida, custoDaAcao, comicio, caminhada, redeSocial, debate, alianca, candidatosGovernador, responderDenuncia, encerrarSemana, pesquisaUf, pesquisaNacionalFloat, pesquisaNacional, margemDeErro, INSTITUTOS, mediaPesquisas, eleger };

const orcamento = (() => {
// Orçamento por ministério. Valores em bilhões FICTÍCIOS, somando 1.000 (unidade do jogo).
// Regras (documentadas em docs/15-orcamento.md):
//  - Remanejar move dinheiro entre pastas: o total não muda e não é receita nova.
//  - Cortar só pode reduzir até CORTE_MAX_PCT da dotação da pasta por ação.
//  - Pastas de piso constitucional (saúde, educação, previdência) só cortam até PISO_CORTE_PCT.
//  - Ampliar exige fonte: 'divida' (aumenta a dívida) ou 'receita' (exige aumento de arrecadação).
//  - Cortes reduzem a dívida; ampliações por dívida aumentam; remanejamento não altera a dívida.
const TOTAL_ORCAMENTO = 1000;
const CORTE_MAX_PCT = 0.15;
const PISO_CORTE_PCT = 0.05;
const PISOS = new Set(['saude', 'educacao', 'previdencia']);
const INVESTIMENTO = new Set(['infraestrutura', 'ciencia', 'educacao']);

const PASTAS_INICIAIS = [
  { id: 'previdencia', nome: 'Previdência', dotacao: 280 },
  { id: 'saude', nome: 'Saúde', dotacao: 150 },
  { id: 'educacao', nome: 'Educação', dotacao: 140 },
  { id: 'assistencia', nome: 'Assistência Social', dotacao: 120 },
  { id: 'infraestrutura', nome: 'Infraestrutura', dotacao: 100 },
  { id: 'defesa', nome: 'Defesa', dotacao: 90 },
  { id: 'seguranca', nome: 'Segurança Pública', dotacao: 60 },
  { id: 'ciencia', nome: 'Ciência e Tecnologia', dotacao: 30 },
  { id: 'meio_ambiente', nome: 'Meio Ambiente', dotacao: 30 },
];

function criarOrcamento() {
  const pastas = PASTAS_INICIAIS.map((p) => ({ ...p, cortado: 0, ampliado: 0 }));
  const soma = pastas.reduce((t, p) => t + p.dotacao, 0);
  if (soma !== TOTAL_ORCAMENTO) throw new Error('Dotações iniciais não somam o total');
  return { total: TOTAL_ORCAMENTO, pastas, historico: [] };
}

const achar = (orc, id) => {
  const p = orc.pastas.find((x) => x.id === id);
  if (!p) throw new Error(`Pasta inexistente: ${id}`);
  return p;
};
const somaDotacoes = (orc) => orc.pastas.reduce((t, p) => t + p.dotacao, 0);

function registrar(orc, texto, detalhe) {
  orc.historico.push({ texto, ...detalhe });
}

// Move dinheiro de uma pasta para outra. O total não muda.
function remanejar(orc0, origemId, destinoId, valor) {
  const orc = structuredClone(orc0);
  if (!(valor > 0)) throw new Error('Valor de remanejamento inválido');
  if (origemId === destinoId) throw new Error('Origem e destino são a mesma pasta');
  const origem = achar(orc, origemId);
  const destino = achar(orc, destinoId);
  if (origem.dotacao < valor) throw new Error(`${origem.nome} não tem ${valor} disponível para remanejar`);
  if (PISOS.has(origemId) && origem.dotacao - valor < origem.dotacao * (1 - PISO_CORTE_PCT)) {
    throw new Error(`${origem.nome} está protegida por piso constitucional`);
  }
  origem.dotacao -= valor;
  destino.dotacao += valor;
  registrar(orc, `Remanejamento de ${valor} de ${origem.nome} para ${destino.nome}`, { tipo: 'remanejar', valor });
  return { orcamento: orc, efeitoDivida: 0 };
}

// Corta a dotação de uma pasta. A economia reduz a dívida pelo mesmo valor (regra do jogo).
function cortar(orc0, pastaId, valor) {
  const orc = structuredClone(orc0);
  const p = achar(orc, pastaId);
  if (!(valor > 0)) throw new Error('Valor de corte inválido');
  const limite = PISOS.has(pastaId) ? PISO_CORTE_PCT : CORTE_MAX_PCT;
  const maximo = p.dotacao * limite;
  if (valor > maximo + 1e-9) {
    throw new Error(`Corte acima do permitido para ${p.nome}: no máximo ${maximo.toFixed(1)} nesta ação`);
  }
  p.dotacao -= valor;
  p.cortado += valor;
  registrar(orc, `Corte de ${valor} em ${p.nome}`, { tipo: 'cortar', valor });
  return { orcamento: orc, efeitoDivida: -valor / 110, efeitoAprovacao: -1 };
}

// Amplia a dotação de uma pasta. A fonte é obrigatória: dívida ou receita.
function ampliar(orc0, pastaId, valor, fonte) {
  const orc = structuredClone(orc0);
  const p = achar(orc, pastaId);
  if (!(valor > 0)) throw new Error('Valor de ampliação inválido');
  if (!['divida', 'receita'].includes(fonte)) {
    throw new Error('Informe a fonte da ampliação: dívida ou receita (aumento de arrecadação)');
  }
  p.dotacao += valor;
  p.ampliado += valor;
  registrar(orc, `Ampliação de ${valor} em ${p.nome} (fonte: ${fonte})`, { tipo: 'ampliar', valor, fonte });
  const investe = INVESTIMENTO.has(pastaId);
  return {
    orcamento: orc,
    efeitoDivida: fonte === 'divida' ? valor / 110 : 0,
    efeitoAprovacao: fonte === 'receita' ? -2 : (investe ? 1 : 0),
    efeitoPib: investe ? valor / 2000 : 0,
  };
}

// Resumo: pastas com dotação, participação no total e variação líquida.
function resumoOrcamento(orc) {
  const total = somaDotacoes(orc);
  return {
    total,
    pastas: orc.pastas.map((p) => ({
      id: p.id, nome: p.nome, dotacao: p.dotacao,
      participacao: total ? (p.dotacao / total) * 100 : 0,
      variacao: p.dotacao - PASTAS_INICIAIS.find((i) => i.id === p.id).dotacao,
    })),
  };
}

function invariantesOrcamento(orc) {
  const erros = [];
  if (Math.abs(somaDotacoes(orc) - (TOTAL_ORCAMENTO + orc.pastas.reduce((t, p) => t + p.ampliado - p.cortado, 0))) > 1e-6) {
    erros.push('soma das dotações não bate com total + ampliações - cortes');
  }
  for (const p of orc.pastas) if (p.dotacao < -1e-9) erros.push(`dotação negativa em ${p.nome}`);
  return erros;
}

return { TOTAL_ORCAMENTO, CORTE_MAX_PCT, PISO_CORTE_PCT, criarOrcamento, remanejar, cortar, ampliar, resumoOrcamento, invariantesOrcamento };
})();
