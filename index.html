  const i = state.indicadores;
  const total = state.orcamento?.pastas?.reduce((soma, p) => soma + p.dotacao, 0) ?? 1000;
  const receitaBase = 185 + (i.pib - 2) * 2.2 - (i.desemprego - 7.5) * 1.1;
  const despesaBase = 190 + (total - 1000) * 0.08;
  f.receita = Math.max(0, Math.round(receitaBase * 10) / 10);
  f.despesa = Math.max(0, Math.round(despesaBase * 10) / 10);
  f.juros = Math.max(0, Math.round((42 + (i.divida - 60) * 0.35 + (i.inflacao - 4.5) * 1.4) * 10) / 10);
  f.resultadoPrimario = Math.round((f.receita - f.despesa) * 10) / 10;
  f.resultadoNominal = Math.round((f.resultadoPrimario - f.juros) * 10) / 10;
  f.caixa = Math.round(clamp(f.caixa + f.resultadoNominal * 0.025, 0, 100) * 10) / 10;
  f.historico = [...(f.historico ?? []), {
    mes: state.mes, receita: f.receita, despesa: f.despesa, juros: f.juros,
    primario: f.resultadoPrimario, nominal: f.resultadoNominal, caixa: f.caixa,
  }].slice(-48);
  // O resultado fiscal afeta a dívida gradualmente, sem converter 1 unidade em 1 ponto de PIB.
  i.divida = clamp(i.divida - f.resultadoNominal * 0.006, ...CLAMP.divida);
}

function criarGoverno({ seed, deputados, senadores, partidoDoPresidente, aliancas = {}, dificuldade = 'normal' }) {
  if (!Array.isArray(deputados) || deputados.length !== CADEIRAS) {
    throw new Error(`A Câmara precisa de ${CADEIRAS} deputados`);
  }
  if (!Array.isArray(senadores) || senadores.length !== SENADORES_TOTAL) {
    throw new Error(`O Senado precisa de ${SENADORES_TOTAL} senadores`);
  }
  return {
    versao: 2, seed, contador: 0, mes: 1, fase: 'governo', mandatoNumero: 1,
    paramsGoverno: PARAMS_GOVERNO[dificuldade] ?? PARAMS_GOVERNO.normal,
    crises: [], historicoCrises: [], ultimaCrise: {},
    partidoDoPresidente: partidoDoPresidente ?? null,
    indicadores: { pib: 2.0, inflacao: 4.5, desemprego: 7.5, divida: 72, aprovacao: 50 },
    camara: montarCasa(deputados, seed, partidoDoPresidente, ufsComAliado(aliancas)),
    senado: montarCasa(senadores, seed + 7919, partidoDoPresidente, ufsComAliado(aliancas)),
    medidas: [], eventos: [], historicoAprovacao: [],
    gruposSociais: GRUPOS_SOCIAIS_INICIAIS.map((g) => ({ ...g })),
    fiscal: criarPainelFiscal(),
    ministros: MINISTERIOS.map((nome, idx) => ({ id: `min-${idx}`, pasta: nome, nome: null, confianca: 50 })),
    governadores: UFS_GOVERNO.map((uf) => ({ uf, apoio: 0, negociacoes: 0 })),
    estatais: ESTATAIS_INICIAIS.map((e) => ({ ...e })),
    orcamento: criarOrcamento(),
  };
}

function escalar(efeitos, k) {
  const r = {};
  for (const [chave, v] of Object.entries(efeitos ?? {})) r[chave] = v * k;
  return r;
}

// Atualiza uma partida de governo salva em versão antiga (sem Senado, ou com parlamentares
// sem nome). Mantém mês, indicadores, medidas e eventos. Os parlamentares passam a vir dos dados atuais.
function migrarGoverno(g, deputados, senadores) {
  const atual = g.versao === 2 && Array.isArray(g.senado) && g.camara?.[0]?.nome;
  if (atual) {
    if (g.orcamento && Array.isArray(g.gruposSociais) && Array.isArray(g.ministros) && Array.isArray(g.governadores) && Array.isArray(g.estatais) && g.fiscal) return g;
    return { ...g, orcamento: g.orcamento ?? criarOrcamento(), gruposSociais: g.gruposSociais ?? GRUPOS_SOCIAIS_INICIAIS.map((x) => ({ ...x })), ministros: g.ministros ?? MINISTERIOS.map((nome, idx) => ({ id: `min-${idx}`, pasta: nome, nome: null, confianca: 50 })), governadores: g.governadores ?? UFS_GOVERNO.map((uf) => ({ uf, apoio: 0, negociacoes: 0 })), estatais: g.estatais ?? ESTATAIS_INICIAIS.map((e) => ({ ...e })), fiscal: g.fiscal ?? criarPainelFiscal() };
  }
  const migrado = {
    ...g,
    versao: 2,
    contador: g.contador ?? 0,
    medidas: g.medidas ?? [],
    eventos: g.eventos ?? [],
    camara: montarCasa(deputados, g.seed, g.partidoDoPresidente ?? null),
    senado: montarCasa(senadores, g.seed + 7919, g.partidoDoPresidente ?? null),
  };
  migrado.mandatoNumero = g.mandatoNumero ?? 1;
  migrado.crises = g.crises ?? [];
  migrado.historicoCrises = g.historicoCrises ?? [];
  migrado.ultimaCrise = g.ultimaCrise ?? {};
  migrado.historicoAprovacao = g.historicoAprovacao ?? [];
  migrado.gruposSociais = g.gruposSociais ?? GRUPOS_SOCIAIS_INICIAIS.map((x) => ({ ...x }));
  migrado.ministros = g.ministros ?? MINISTERIOS.map((nome, idx) => ({ id: `min-${idx}`, pasta: nome, nome: null, confianca: 50 }));
  migrado.governadores = g.governadores ?? UFS_GOVERNO.map((uf) => ({ uf, apoio: 0, negociacoes: 0 }));
  migrado.estatais = g.estatais ?? ESTATAIS_INICIAIS.map((e) => ({ ...e }));
  migrado.orcamento = g.orcamento ?? criarOrcamento();
  migrado.fiscal = g.fiscal ?? criarPainelFiscal();
  migrado.eventos = [...migrado.eventos, { mes: migrado.mes, texto: 'Parlamentares atualizados para a versão atual do jogo' }];
  return migrado;
}

// Interpreta o texto da medida. Não é análise jurídica: é uma leitura por palavras-chave.
function classificarMedida(texto) {
  const original = (texto ?? '').trim();
  if (original.length < 15) {
    throw new Error('Medida vaga: descreva o que muda, para quem e como.');
  }
  const t = semAcento(original);

  let instrumento = 'PL';
  const tributo = /imposto|tribut|aliquota|taxa\b/.test(t);
  if (/\bpec\b|emenda constitucional|constituicao/.test(t)) instrumento = 'PEC';
  else if (/complementar/.test(t)) instrumento = 'PLP';
  else if (/medida provisoria|\bmp\b/.test(t)) instrumento = 'MP';
  else if (!tributo && /decreto|nomear|exonerar|regulament/.test(t)) instrumento = 'decreto';
  if (tributo && instrumento === 'decreto') instrumento = 'PL'; // imposto não sai por decreto

  const valor = original.match(/r\$\s*([\d.,]+)\s*(bi|bilh)/i);
  const custo = valor ? Number(valor[1].replace(/\./g, '').replace(',', '.')) : 0;
  const temFonte = /imposto|tribut|aliquota|corte|cortar|reduz\w* (gasto|despesa)|venda|privatiz|concess|receita/.test(t);
  const gasto = custo > 0 && !/corte|cortar|reduz\w* (gasto|despesa)|venda|privatiz/.test(t)
    && !/aument\w*[^.]*imposto|imposto[^.]*(aument|sobe|cria)/.test(t);

  const efeitos = { pib: 0, inflacao: 0, desemprego: 0, divida: 0 };
  if (/invest|obra|infraestrutura|industri|saneamento|hospital/.test(t)) efeitos.pib += 0.15;
  if (/emprego|trabalh|industri/.test(t)) efeitos.desemprego -= 0.2;
  if (/aument\w*[^.]*imposto|imposto[^.]*(aument|sobe|cria)|sobe\w* imposto/.test(t)) efeitos.pib -= 0.2;
  if (/congel|reajuste|subsidi|gasolina/.test(t)) efeitos.inflacao += 0.2;
  if (/corte|cortar|reduz\w* (gasto|despesa)/.test(t)) efeitos.inflacao -= 0.2;
  if (gasto && !temFonte) efeitos.divida += custo / 110;

  // Custo político (trade-off): impostos desgastam a aprovação mas reduzem a dívida;
  // cortes reduzem a dívida e desgastam; gastos agradam e aumentam a dívida.
  if (tributo && /aument|sobe|cria|eleva/.test(t)) { efeitos.aprovacao = (efeitos.aprovacao ?? 0) - 2; efeitos.divida -= 0.5; }
  if (/corte|cortar|reduz\w* (gasto|despesa)/.test(t)) { efeitos.aprovacao = (efeitos.aprovacao ?? 0) - 1; efeitos.divida -= 0.3; }
  if (gasto && temFonte && !tributo) { efeitos.aprovacao = (efeitos.aprovacao ?? 0) + 1; }

  return { instrumento, custo, temFonte, gasto, efeitos, texto: original };
}

// Votação individual numa casa. Probabilidade depende da afinidade (fictícia)
// e da aprovação popular.
function votarCasa(state, casa, medida) {
  const bonusPopular = (state.indicadores.aprovacao - 50) / 200;
  const bonusMedida = (medida.efeitos.pib - medida.efeitos.inflacao) * 0.1;
  const votos = { sim: 0, nao: 0, nominais: [] };
  for (const parlamentar of state[casa]) {
    const p = clamp(0.5 + parlamentar.afinidade * 0.4 + bonusPopular + bonusMedida, 0.02, 0.98);
    const voto = sortear(state) < p ? 'sim' : 'nao';
    votos[voto] += 1;
    votos.nominais.push({
      id: parlamentar.id, nome: parlamentar.nome, partido: parlamentar.partido,
      uf: parlamentar.uf, voto,
    });
  }
  return votos;
}

// Aprovação por grupos é uma mecânica fictícia baseada em palavras-chave da medida.
function atualizarGruposSociais(state, medida, fase = 'medida') {
  if (!Array.isArray(state.gruposSociais)) {
    state.gruposSociais = GRUPOS_SOCIAIS_INICIAIS.map((g) => ({ ...g }));
  }
  const t = semAcento(medida.texto ?? '');
  const ajustes = {
    trabalhadores: /salario|minimo|emprego|trabalh|sindicat|jornada|ferias|direito trabalhista/.test(t) ? 2 : 0,
    empresariado: /empresa|industria|empreendedor|credito|desburocrat|investimento privado|imposto sobre empresa/.test(t) ? 2 : 0,
    servidores: /servidor|funcionario publico|carreira publica|concurso|reajuste salarial/.test(t) ? 2 : 0,
    jovens: /universidade|estudante|jovem|primeiro emprego|educacao tecnica|internet nas escolas/.test(t) ? 2 : 0,
    agro: /agricultura|agronegocio|rural|produtor|irrigacao|seguro rural/.test(t) ? 2 : 0,
    saude: /saude|hospital|sus|medico|enfermagem|vacina|ubs/.test(t) ? 2 : 0,
    educacao: /educacao|escola|professor|creche|alfabetizacao/.test(t) ? 2 : 0,
    'baixa-renda': /pobreza|baixa renda|bolsa|moradia popular|cesta basica|alimentacao|saneamento/.test(t) ? 2 : 0,
  };
  for (const g of state.gruposSociais) {
    let delta = ajustes[g.id] ?? 0;
    if (/corte|cortar|reduz\w* (gasto|despesa)|congel/.test(t) && ['servidores', 'trabalhadores', 'baixa-renda'].includes(g.id)) delta -= 1;
    if (/aument\w*[^.]*imposto|imposto[^.]*(aument|sobe|cria)/.test(t) && ['empresariado', 'agro'].includes(g.id)) delta -= 1;
    if (fase === 'mes') delta = 0;
    g.aprovacao = clamp(g.aprovacao + delta, 0, 100);
  }
}

function protocolarMedida(state, texto) {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  const s = structuredClone(state);
  const m = classificarMedida(texto);
  if (m.gasto && !m.temFonte) {
    throw new Error('Sem fonte de financiamento identificada: diga de onde sai o dinheiro (imposto, corte de gasto ou venda de ativo).');
  }

  const registro = { mes: s.mes, texto: m.texto, instrumento: m.instrumento, custo: m.custo };
  if (m.instrumento === 'decreto') {
    aplicarEfeitos(s, m.efeitos);
    atualizarGruposSociais(s, m);
    registro.resultado = 'aplicado por decreto';
  } else {
    const q = m.instrumento === 'PEC' ? QUORUM.pec : QUORUM.lei;
    const votosCamara = votarCasa(s, 'camara', m);
    registro.votos = { camara: votosCamara };
    if (votosCamara.sim < q.camara) {
      registro.resultado = `rejeitada na Câmara (${votosCamara.sim} a ${votosCamara.nao}, precisava de ${q.camara})`;
      s.indicadores.aprovacao = clamp(s.indicadores.aprovacao - 1, ...CLAMP.aprovacao);
    } else {
      const votosSenado = votarCasa(s, 'senado', m);
      registro.votos.senado = votosSenado;
      if (votosSenado.sim < q.senado) {
        registro.resultado = `rejeitada no Senado (${votosSenado.sim} a ${votosSenado.nao}, precisava de ${q.senado})`;
        s.indicadores.aprovacao = clamp(s.indicadores.aprovacao - 1, ...CLAMP.aprovacao);
      } else {
        aplicarEfeitos(s, m.efeitos);
        atualizarGruposSociais(s, m);
        registro.resultado = `aprovada: Câmara ${votosCamara.sim} a ${votosCamara.nao}, Senado ${votosSenado.sim} a ${votosSenado.nao}`;
        s.indicadores.aprovacao = clamp(s.indicadores.aprovacao + 1, ...CLAMP.aprovacao);
      }
    }
  }
  s.medidas.push(registro);
  s.eventos.push({ mes: s.mes, texto: `${m.instrumento}: ${registro.resultado}` });
  return s;
}

function aplicarEfeitos(s, efeitos) {
  for (const k of Object.keys(efeitos)) {
    s.indicadores[k] = clamp(s.indicadores[k] + efeitos[k], CLAMP[k] ?? [-Infinity, Infinity]);
  }
}

// Fecha o mês: economia com inércia, crises (novas e em curso), aprovação e calendário.
function encerrarMes(state) {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  const s = structuredClone(state);
  s.crises = s.crises ?? [];
  s.historicoCrises = s.historicoCrises ?? [];
  s.ultimaCrise = s.ultimaCrise ?? {};
  const i = s.indicadores;
  // Cada indicador tem patamar médio e volta a ele com inércia. Sem isso, a economia
  // entraria numa espiral (dívida sobe, inflação sobe, desemprego sobe) que o jogo não pretende.
  i.pib = clamp(i.pib * 0.9 + 2.0 * 0.1, ...CLAMP.pib);
  i.inflacao = clamp(i.inflacao * 0.9 + 4.5 * 0.1 + (i.divida - 72) * 0.01, ...CLAMP.inflacao);
  i.desemprego = clamp(i.desemprego * 0.95 + 7.5 * 0.05 - 0.1 * (i.pib - 2), ...CLAMP.desemprego);
  i.divida = clamp(i.divida + (72 - i.divida) * 0.02, ...CLAMP.divida);

  // Evento especial raro (tem prioridade sobre a crise comum neste mês).
  let iniciouEspecial = false;
  if (s.crises.length < MAX_CRISES_ATIVAS && sortear(s) < PROB_EVENTO_ESPECIAL) {
    const esp = escolherEventoEspecial({ ...s }, () => sortear(s));
    if (esp) {
      const crise = iniciarCrise(s, esp);
      s.crises.push(crise);
      s.ultimaCrise[esp.id] = s.mes;
      s.eventos.push({ mes: s.mes, texto: `Evento especial: ${esp.titulo}` });
      iniciouEspecial = true;
    }
  }

  // Nova crise (no máximo uma por mês, e até MAX_CRISES_ATIVAS ao mesmo tempo).
  if (!iniciouEspecial && s.crises.length < MAX_CRISES_ATIVAS && sortear(s) < paramsGov(s).probNovaCrise) {
    const def = escolherCrise({ ...s, mes: s.mes }, () => sortear(s));
    if (def) {
      const crise = iniciarCrise(s, def);
      s.crises.push(crise);
      s.ultimaCrise[def.id] = s.mes;
      s.eventos.push({ mes: s.mes, texto: `Crise: ${def.titulo}` });
    }
  }

  // Efeitos das crises em curso.
  for (const c of s.crises) {
    aplicarEfeitos(s, escalar(c.mensal, paramsGov(s).severidade));
    c.restante -= 1;
  }
  // Crises que acabaram vão para o histórico.
  const encerradas = s.crises.filter((c) => c.restante <= 0);
  s.crises = s.crises.filter((c) => c.restante > 0);
  for (const c of encerradas) {
    s.historicoCrises.push({ uid: c.uid, id: c.id, titulo: c.titulo, inicio: c.inicio, fim: s.mes, desfecho: 'encerrada sem resposta' });
    s.eventos.push({ mes: s.mes, texto: `Fim da crise: ${c.titulo}` });
  }

  // A aprovação tem inércia e volta devagar ao patamar médio de 50%: crises pesam, mas se recuperam.
  i.aprovacao = clamp(i.aprovacao * 0.9 + 50 * 0.1 + (i.pib - 2) * 2 - (i.inflacao - 4.5) * 1.5 - (i.desemprego - 7.5), ...CLAMP.aprovacao);
  // Cada grupo reage lentamente ao cenário econômico do mês; não é pesquisa real.
  if (!Array.isArray(s.gruposSociais)) s.gruposSociais = GRUPOS_SOCIAIS_INICIAIS.map((g) => ({ ...g }));
  for (const g of s.gruposSociais) {
    let delta = 0;
    if (i.pib > 3 && ['empresariado', 'trabalhadores', 'jovens'].includes(g.id)) delta += 0.25;
    if (i.inflacao > 6 && ['baixa-renda', 'trabalhadores', 'servidores'].includes(g.id)) delta -= 0.4;
    if (i.desemprego > 9 && ['trabalhadores', 'jovens', 'baixa-renda'].includes(g.id)) delta -= 0.4;
    g.aprovacao = Math.round(clamp(g.aprovacao + delta, 0, 100) * 10) / 10;
  }
  // A opinião segmentada influencia levemente a aprovação geral, sem substituir os indicadores econômicos.
  const mediaGrupos = s.gruposSociais.reduce((total, grupo) => total + grupo.aprovacao, 0) / s.gruposSociais.length;
  i.aprovacao = Math.round(clamp(i.aprovacao * 0.96 + mediaGrupos * 0.04, ...CLAMP.aprovacao) * 10) / 10;
  atualizarPainelFiscal(s);
  s.historicoAprovacao = [...(s.historicoAprovacao ?? []), Math.round(i.aprovacao * 10) / 10];
  s.eventos.push({ mes: s.mes, texto: `Fim do mês ${s.mes}: aprovação ${i.aprovacao.toFixed(0)}%` });
  s.mes += 1;
  if (s.mes > MESES_GOVERNO) s.fase = 'encerrado';
  return s;
}

// Resposta do presidente a uma crise em curso: aplica o efeito da resposta e encerra a crise.
function responderCrise(state, uid, respostaId) {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  const s = structuredClone(state);
  const c = (s.crises ?? []).find((x) => x.uid === uid);
  if (!c) throw new Error('Crise não encontrada ou já encerrada');
  if (c.respondida) throw new Error('Esta crise já foi respondida');
  const opcoes = c.respostas ?? (c.resposta ? [c.resposta] : []);
  if (opcoes.length === 0) throw new Error('Esta crise não exige resposta');
  const escolhida = respostaId
    ? opcoes.find((o) => o.id === respostaId)
    : (opcoes.length === 1 ? opcoes[0] : null);
  if (!escolhida) throw new Error('Escolha uma das respostas disponíveis');
  aplicarEfeitos(s, escolhida.efeitos);
  atualizarGruposSociais(s, { texto: escolhida.texto });
  c.respondida = true;
  s.crises = s.crises.filter((x) => x.uid !== uid);
  s.historicoCrises.push({ uid: c.uid, id: c.id, titulo: c.titulo, inicio: c.inicio, fim: s.mes, desfecho: `respondida: ${escolhida.texto}` });
  s.eventos.push({ mes: s.mes, texto: `Resposta à crise (${c.titulo}): ${escolhida.texto}` });
  // Consequência encadeada determinística: decisões podem abrir uma repercussão posterior.
  const txt = semAcento(escolhida.texto ?? '');
  if (/investig|auditoria|transpar|comissao/.test(txt)) {
    s.eventos.push({ mes: s.mes, texto: `Desdobramento: órgãos de controle anunciam acompanhamento da resposta à crise ${c.titulo}.` });
    s.indicadores.aprovacao = clamp(s.indicadores.aprovacao + 0.25, 0, 100);
  } else if (/adiar|ignorar|negar|silencio/.test(txt)) {
    s.eventos.push({ mes: s.mes, texto: `Desdobramento: a imprensa mantém a crise ${c.titulo} em pauta no próximo ciclo.` });
    s.indicadores.aprovacao = clamp(s.indicadores.aprovacao - 0.5, 0, 100);
  }
  return s;
}

// Nomeação ministerial: nomes escolhidos pelo jogador, efeitos de jogo fictícios.
function nomearMinistro(state, pasta, nome) {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  const pessoa = String(nome ?? '').trim();
  if (pessoa.length < 2 || pessoa.length > 70) throw new Error('Informe um nome de 2 a 70 caracteres.');
  if (!MINISTERIOS.includes(pasta)) throw new Error('Ministério inválido.');
  const s = structuredClone(state);
  s.ministros ??= MINISTERIOS.map((p, idx) => ({ id: `min-${idx}`, pasta: p, nome: null, confianca: 50 }));
  const m = s.ministros.find((x) => x.pasta === pasta);
  m.nome = pessoa; m.confianca = clamp(m.confianca + 3, 0, 100);
  s.indicadores.aprovacao = clamp(s.indicadores.aprovacao + 0.3, 0, 100);
  s.eventos.push({ mes: s.mes, texto: `Nomeação: ${pessoa} assume o Ministério de ${pasta}.` });
  return s;
}

// Negociação com governos estaduais fictícios; não afirma apoio de governadores reais.
function negociarGovernador(state, uf, proposta = 'cooperacao') {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  if (!UFS_GOVERNO.includes(uf)) throw new Error('UF inválida.');
  if (!['cooperacao', 'investimento', 'confronto'].includes(proposta)) throw new Error('Proposta inválida.');
  const s = structuredClone(state);
  s.governadores ??= UFS_GOVERNO.map((x) => ({ uf: x, apoio: 0, negociacoes: 0 }));
  const g = s.governadores.find((x) => x.uf === uf);
  if (g.negociacoes >= 4) throw new Error(`Limite de negociações atingido para ${uf} neste mandato.`);
  g.negociacoes += 1;
  if (proposta === 'cooperacao') { g.apoio = clamp(g.apoio + 12, -100, 100); s.indicadores.aprovacao = clamp(s.indicadores.aprovacao + 0.4, 0, 100); }
  if (proposta === 'investimento') { g.apoio = clamp(g.apoio + 18, -100, 100); s.indicadores.divida = clamp(s.indicadores.divida + 0.35, 20, 150); s.indicadores.pib = clamp(s.indicadores.pib + 0.08, -5, 8); }
  if (proposta === 'confronto') { g.apoio = clamp(g.apoio - 15, -100, 100); s.indicadores.aprovacao = clamp(s.indicadores.aprovacao - 0.6, 0, 100); }
  // A influência estadual é deliberadamente pequena e limitada.
  for (const p of [...s.camara, ...s.senado]) if (p.uf === uf) p.afinidade = clamp(p.afinidade + (proposta === 'confronto' ? -0.025 : 0.025), -1, 1);
  s.eventos.push({ mes: s.mes, texto: `Articulação federativa em ${uf}: ${proposta === 'cooperacao' ? 'cooperação administrativa' : proposta === 'investimento' ? 'pacto de investimento' : 'confronto público'}. Apoio simulado: ${g.apoio}.` });
  return s;
}

function gerirEstatal(state, id, acao) {
  if (state.fase !== 'governo') throw new Error('O governo já terminou');
  if (!['investir', 'modernizar', 'auditar'].includes(acao)) throw new Error('Ação de estatal inválida.');
  const s = structuredClone(state);
  s.estatais ??= ESTATAIS_INICIAIS.map((e) => ({ ...e }));
  const e = s.estatais.find((x) => x.id === id);
  if (!e) throw new Error('Empresa estatal não encontrada.');
  if (acao === 'investir') { if (e.caixa < 8) throw new Error('Caixa insuficiente na empresa para investir.'); e.caixa -= 8; e.eficiencia = clamp(e.eficiencia + 2, 0, 100); e.reputacao = clamp(e.reputacao + 1, 0, 100); s.indicadores.pib = clamp(s.indicadores.pib + 0.1, -5, 8); s.indicadores.divida = clamp(s.indicadores.divida + 0.15, 20, 150); }
  if (acao === 'modernizar') { if (e.caixa < 12) throw new Error('Caixa insuficiente na empresa para modernizar.'); e.caixa -= 12; e.eficiencia = clamp(e.eficiencia + 5, 0, 100); e.reputacao = clamp(e.reputacao + 2, 0, 100); }
  if (acao === 'auditar') { e.reputacao = clamp(e.reputacao + 4, 0, 100); e.eficiencia = clamp(e.eficiencia + 1, 0, 100); s.indicadores.aprovacao = clamp(s.indicadores.aprovacao + 0.4, 0, 100); }
  s.eventos.push({ mes: s.mes, texto: `Gestão da estatal ${e.nome}: ${acao}. Eficiência ${e.eficiencia}/100, reputação ${e.reputacao}/100.` });
  return s;
}

// Contagem de parlamentares por partido, a partir dos dados reais.
function bancadas(state, casa = 'camara') {
  const cont = {};
  for (const d of state[casa]) cont[d.partido] = (cont[d.partido] ?? 0) + 1;
  return Object.entries(cont).sort((a, b) => b[1] - a[1]);
}

// ---- Ações sobre o orçamento. Cada uma altera o governo conforme o efeito devolvido pelo módulo.
function aplicarOrcamento(g, resultado, texto) {
  const s = structuredClone(g);
  s.orcamento = resultado.orcamento;
  const e = {};
  if (resultado.efeitoDivida) e.divida = resultado.efeitoDivida;
  if (resultado.efeitoAprovacao) e.aprovacao = resultado.efeitoAprovacao;
  if (resultado.efeitoPib) e.pib = resultado.efeitoPib;
  aplicarEfeitos(s, e);
  s.eventos.push({ mes: s.mes, texto });
  return s;
}

function remanejarOrcamento(g, origem, destino, valor) {
  if (g.fase !== 'governo') throw new Error('O governo já terminou');
  return aplicarOrcamento(g, remanejar(g.orcamento, origem, destino, valor), `Orçamento: remanejados ${valor} de ${origem} para ${destino}`);
}

function cortarOrcamento(g, pasta, valor) {
  if (g.fase !== 'governo') throw new Error('O governo já terminou');
  return aplicarOrcamento(g, cortar(g.orcamento, pasta, valor), `Orçamento: corte de ${valor} em ${pasta}`);
}

function ampliarOrcamento(g, pasta, valor, fonte) {
  if (g.fase !== 'governo') throw new Error('O governo já terminou');
  return aplicarOrcamento(g, ampliar(g.orcamento, pasta, valor, fonte), `Orçamento: ampliação de ${valor} em ${pasta} (fonte: ${fonte})`);
}

// Situação atual de uma medida, derivada do resultado registrado. Não altera efeitos.
function situacaoDaMedida(m) {
  const r = m.resultado ?? '';
  if (/aplicado por decreto/.test(r)) return 'Em vigor por decreto';
  if (/rejeitad/.test(r)) return 'Rejeitada';
  if (/aprovada/.test(r)) return m.instrumento === 'PEC' ? 'Aprovada: emenda constitucional' : 'Aprovada: em vigor';
  return 'Situação indefinida';
}

return { MESES_GOVERNO, CADEIRAS, SENADORES_TOTAL, QUORUM, PARAMS_GOVERNO, BONUS_PALANQUE, MINISTERIOS, UFS_GOVERNO, ESTATAIS_INICIAIS, criarPainelFiscal, criarGoverno, migrarGoverno, classificarMedida, protocolarMedida, encerrarMes, responderCrise, nomearMinistro, negociarGovernador, gerirEstatal, bancadas, remanejarOrcamento, cortarOrcamento, ampliarOrcamento, situacaoDaMedida };
})();

// ---- src/motor/sucessao.js ----
const sucessao = (() => {
// Fim do mandato: reeleição (uma vez, como na Constituição) ou sucessão por outro candidato.
// A eleição seguinte é uma simulação: a votação de cada estado depende da aprovação do governo,
// com ruído por estado. Não é previsão eleitoral.
const { criarRng } = rng;
const { distribuirPercentuais } = percentuais;
const { apurar } = apuracao;
const { ESTADOS } = estados;

const MAX_REELEICOES = 1; // um mandato seguido de uma reeleição, no máximo

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function opcoesFimMandato(g) {
  return {
    podeReeleicao: g.mandatoNumero - 1 < MAX_REELEICOES,
    mandato: g.mandatoNumero,
    aprovacao: g.indicadores.aprovacao,
  };
}

// Apuração da eleição: "governo" (sua candidatura ou sucessor) contra "oposição".
function apurarEleicao(g) {
  const rng = criarRng((g.seed + 99991 * g.mandatoNumero) >>> 0);
  const estados = ESTADOS.map((e) => {
    // Apoio ao governo acompanha a aprovação, com um deslocamento de +8 (calibragem do jogo:
    // um governo com aprovação mediana disputa a eleição de forma equilibrada) e ruído por estado.
    const deslocamento = (g.paramsGoverno?.reeleicaoDeslocamento ?? 8);
    const apoioGoverno = clamp(g.indicadores.aprovacao + deslocamento + (rng() * 16 - 8), 5, 95);
    const pct = distribuirPercentuais({ governo: apoioGoverno, oposicao: 100 - apoioGoverno }, 100);
    const pesoInt = Math.round(e.peso * 1000);
    return { uf: e.uf, votos: { governo: pesoInt * pct.governo, oposicao: pesoInt * pct.oposicao } };
  });
  const r = apurar(estados, ['governo', 'oposicao']);
  // Sem maioria absoluta no 1º turno, o 2º turno decide entre os dois.
  const vencedor = r.vencedorPrimeiroTurno
    ?? (r.totais.governo >= r.totais.oposicao ? 'governo' : 'oposicao');
  return {
    vencedor,
    segundoTurno: r.vencedorPrimeiroTurno === null,
    percentuais: r.percentuais,
    totais: r.totais,
  };
}

// Escolha do fim de mandato:
//  - { tipo: 'reeleicao' }
//  - { tipo: 'sucessor', sucessor: { nome, partido } }
function eleicaoSeguinte(g, escolha) {
  if (g.fase !== 'encerrado') throw new Error('O mandato ainda não terminou');
  const s = structuredClone(g);
  const opcoes = opcoesFimMandato(s);

  if (escolha.tipo === 'reeleicao') {
    if (!opcoes.podeReeleicao) throw new Error('Não é permitida mais de uma reeleição seguida');
  } else if (escolha.tipo === 'sucessor') {
    const nome = (escolha.sucessor?.nome ?? '').trim();
    if (!nome) throw new Error('Informe o nome do sucessor');
    if (nome.length > 60) throw new Error('Nome do sucessor muito longo');
    s.sucessor = { nome, partido: escolha.sucessor.partido ?? 'Sem partido' };
  } else {
    throw new Error('Escolha inválida para o fim do mandato');
  }

  const resultado = apurarEleicao(s);
  const ganhou = resultado.vencedor === 'governo';
  s.mandatos = [...(s.mandatos ?? []), {
    numero: s.mandatoNumero,
    aprovacaoFinal: Math.round(s.indicadores.aprovacao),
    medidas: s.medidas.length,
    crisesEnfrentadas: (s.historicoCrises ?? []).length,
  }];
  s.eleicaoSeguinte = { tipo: escolha.tipo, ganhou, percentuais: resultado.percentuais, segundoTurno: resultado.segundoTurno };

  if (escolha.tipo === 'reeleicao' && ganhou) {
    // Reeleito: começa um novo mandato, herdando indicadores, crises e histórico.
    s.mandatoNumero += 1;
    s.mes = 1;
    s.fase = 'governo';
    s.eventos.push({ mes: 0, texto: `Reeleito para o mandato ${s.mandatoNumero}` });
    return s;
  }
  // Em qualquer outro caso a carreira presidencial desta partida termina.
  s.fase = 'carreira_encerrada';
  s.eventos.push({ mes: s.mes, texto: ganhou
    ? `Sucessão: ${s.sucessor.nome} venceu a eleição`
    : 'A oposição venceu a eleição: carreira encerrada' });
  return s;
}

return { MAX_REELEICOES, opcoesFimMandato, apurarEleicao, eleicaoSeguinte };
})();

// ---- src/motor/pontuacao.js ----
const pontuacao = (() => {
// Pontuação final da partida. Só usa o que aconteceu no jogo; nunca fica negativa.
// Os pesos são ajustes do jogo, não métricas oficiais.
function calcularPontuacao(p) {
  const detalhes = {};
  const r = p.resultado;

  // Eleição
  if (r) {
    const pct = r.primeiroTurno?.percentuais?.jogador ?? 0;
    detalhes.votos = Math.round(pct * 2);
    if (r.vencedor === 'jogador') {
      detalhes.vitoria = r.segundoTurno ? 60 : 100;
    }
  }

  // Campanha
  const debates = Object.values(p.debates ?? {});
  detalhes.debates = debates.length * 5;
  detalhes.debatesTecnicos = debates.filter((d) => d === 'tecnica').length * 5;
  detalhes.aliancas = Object.keys(p.aliancas ?? {}).length * 8;
  const denuncias = (p.eventos ?? []).filter((e) => e.tipo === 'denuncia').length;
  detalhes.denunciasRespondidas = Math.max(0, denuncias - (p.escandaloPendente ? 1 : 0)) * 4;

  // Governo
  const g = p.governo;
  if (g) {
    detalhes.aprovacao = Math.round(Math.max(0, g.indicadores.aprovacao) * 2);
    const aprovadas = (g.medidas ?? []).filter((m) => /aprovad|aplicad/.test(m.resultado ?? '')).length;
    detalhes.medidasAprovadas = aprovadas * 6;
    const respondidas = (g.historicoCrises ?? []).filter((c) => c.desfecho?.startsWith('respondida')).length;
    detalhes.crisesRespondidas = respondidas * 8;
    const semResposta = (g.historicoCrises ?? []).filter((c) => c.desfecho === 'encerrada sem resposta').length;
    detalhes.crisesSemResposta = -semResposta * 3;
    if (g.eleicaoSeguinte?.ganhou && g.eleicaoSeguinte.tipo === 'reeleicao') detalhes.reeleicao = 150;
    if (g.eleicaoSeguinte?.ganhou && g.eleicaoSeguinte.tipo === 'sucessor') detalhes.sucessao = 100;
  }

  const total = Object.values(detalhes).reduce((t, v) => t + v, 0);
  return { total: Math.max(0, Math.round(total)), detalhes };
}

return { calcularPontuacao };
})();

// ---- src/motor/conquistas.js ----

// Conquistas: concedidas só quando a condição é satisfeita pelo que aconteceu na partida.
const CONQUISTAS = [
  { id: 'primeira_vitoria', titulo: 'Eleito no primeiro turno', descricao: 'Vença a eleição sem segundo turno.',
    condicao: (p) => p.resultado?.vencedor === 'jogador' && !p.resultado?.segundoTurno },

      return rivais.length > 0 && ultima.resultados.jogador < Math.max(...rivais);

  { id: 'reforma_constitucional', titulo: 'Constituinte de um homem só', descricao: 'Aprove uma PEC no Congresso.',

    condicao: (p) => {

function conquistasDe(p) {
  return CONQUISTAS.filter((c) => {

  }).map((c) => c.id);
}

function catalogo(id) {

}

return { CONQUISTAS, conquistasDe, catalogo };
})();

// ---- src/motor/ranking.js ----
const ranking = (() => {
// Ranking local. Cada partida entra uma única vez (chave = semente + candidato),
// então recarregar a página ou reabrir o resultado não duplica pontos.
const { calcularPontuacao } = pontuacao;
const { conquistasDe } = conquistas;

const LIMITE_RANKING = 20;

function chavePartida(p) {
  return `${p.seed}-${(p.candidatos?.[0]?.nome ?? '').toLowerCase()}`;
}

// Resumo de uma partida terminada, usado no ranking e no histórico pessoal.
function entradaDe(p, data = new Date().toISOString().slice(0, 10)) {
  const { total, detalhes } = calcularPontuacao(p);
  return {
    chave: chavePartida(p),
    nome: p.candidatos[0].nome,
    partido: p.candidatos[0].partido,
    dificuldade: p.dificuldade ?? 'normal',
    pontos: total,
    detalhes,
    conquistas: conquistasDe(p),
    desfecho: desfechoDe(p),
    vitoria: p.resultado?.vencedor === 'jogador',
    data,
  };
}

// Histórico completo (sem limite): cada partida entra uma única vez.
function registrarNoHistorico(lista, p, data) {
  if (!p.resultado && !p.governo) throw new Error('A partida ainda não terminou');
  const entrada = entradaDe(p, data);
  if (lista.some((e) => e.chave === entrada.chave)) return { lista, novo: false };
  return { lista: [...lista, entrada], novo: true, entrada };
}

function registrarNoRanking(lista, p, data = new Date().toISOString().slice(0, 10)) {
  if (!p.resultado && !p.governo) throw new Error('A partida ainda não terminou');
  const chave = chavePartida(p);
  if (lista.some((e) => e.chave === chave)) return { lista, novo: false };
  const { total, detalhes } = calcularPontuacao(p);
  const entrada = {
    chave,
    nome: p.candidatos[0].nome,
    partido: p.candidatos[0].partido,
    dificuldade: p.dificuldade ?? 'normal',
    pontos: total,
    detalhes,
    conquistas: conquistasDe(p),
    desfecho: desfechoDe(p),
    data,
  };
  const nova = [...lista, entrada]
    .sort((a, b) => b.pontos - a.pontos || (a.data < b.data ? -1 : 1))
    .slice(0, LIMITE_RANKING);
  return { lista: nova, novo: nova.includes(entrada), entrada };
}

function desfechoDe(p) {
  const g = p.governo;
  if (g?.eleicaoSeguinte?.ganhou && g.eleicaoSeguinte.tipo === 'reeleicao') return `Reeleito (${g.mandatoNumero}º mandato)`;
  if (g?.eleicaoSeguinte?.ganhou && g.eleicaoSeguinte.tipo === 'sucessor') return 'Elegeu o sucessor';
  if (g?.fase === 'carreira_encerrada') return 'Carreira encerrada';
  if (g) return `Em governo (mês ${g.mes})`;
  if (p.resultado?.vencedor === 'jogador') return 'Eleito, sem posse';
  if (p.resultado) return 'Derrota na eleição';
  return 'Em campanha';
}

// Mescla um ranking importado (arquivo de outra pessoa) com o local.
// Partidas com a mesma chave não são duplicadas; vale a de maior pontuação.
function mesclarRanking(atual, importado) {
  if (!Array.isArray(importado)) throw new Error('Arquivo de ranking inválido');
  const validas = importado.filter((e) =>
    e && typeof e.chave === 'string' && Number.isFinite(e.pontos) && e.pontos >= 0
    && typeof e.nome === 'string' && Array.isArray(e.conquistas));
  if (validas.length !== importado.length) throw new Error('Há entradas inválidas no arquivo de ranking');
  const porChave = new Map();
  for (const e of [...atual, ...validas]) {
    const antiga = porChave.get(e.chave);
    if (!antiga || e.pontos > antiga.pontos) porChave.set(e.chave, e);
  }
  return [...porChave.values()]
    .sort((a, b) => b.pontos - a.pontos || (a.data < b.data ? -1 : 1))
    .slice(0, LIMITE_RANKING);
}

return { LIMITE_RANKING, chavePartida, entradaDe, registrarNoHistorico, registrarNoRanking, desfechoDe, mesclarRanking };
})();

// ---- src/motor/estatisticas.js ----
const estatisticas = (() => {
// Estatísticas pessoais a partir do histórico completo de partidas terminadas.
const DIFICULDADES_LISTA = ['facil', 'normal', 'dificil'];

function resumoDe(lista) {
  const total = lista.length;
  const vitorias = lista.filter((e) => e.vitoria).length;
  const soma = lista.reduce((t, e) => t + e.pontos, 0);
  return {
    total,
    vitorias,
    derrotas: total - vitorias,
    taxaVitoria: total ? Math.round((vitorias / total) * 100) : 0,
    mediaPontos: total ? Math.round(soma / total) : 0,
    melhor: total ? Math.max(...lista.map((e) => e.pontos)) : 0,
  };
}

function estatisticasPessoais(historico) {
  const geral = resumoDe(historico);
  const conquistas = new Set(historico.flatMap((e) => e.conquistas ?? []));
  const porDificuldade = {};
  for (const d of DIFICULDADES_LISTA) {
    porDificuldade[d] = resumoDe(historico.filter((e) => e.dificuldade === d));
  }
  return { ...geral, conquistasUnicas: conquistas.size, porDificuldade };
}

// Filtra um ranking por dificuldade. 'todas' devolve a lista inteira.
function filtrarRanking(lista, dificuldade = 'todas') {
  if (dificuldade === 'todas') return lista;
  if (!DIFICULDADES_LISTA.includes(dificuldade)) throw new Error(`Dificuldade inválida: ${dificuldade}`);
  return lista.filter((e) => e.dificuldade === dificuldade);
}

return { DIFICULDADES_LISTA, estatisticasPessoais, filtrarRanking };
})();

// ---- src/motor/salaGuerra.js ----
const salaGuerra = (() => {
// Sala de guerra eleitoral: 300 cenários Monte Carlo determinísticos por semente.
// É uma ferramenta lúdica de sensibilidade do modelo, não uma previsão eleitoral real.
const { criarRng } = rng;

const SIMULACOES_PADRAO = 300;

function normalAproximada(rng) {
  // Soma de uniformes centrada em zero: aproxima uma distribuição normal sem dependências.
  let soma = 0;
  for (let i = 0; i < 6; i++) soma += rng();
  return soma - 3;
}

function normalizar(valores) {
  const positivos = Object.fromEntries(Object.entries(valores).map(([id, v]) => [id, Math.max(0.01, v)]));
  const total = Object.values(positivos).reduce((a, b) => a + b, 0);
  if (!Number.isFinite(total) || total <= 0) throw new Error('Não foi possível normalizar o cenário eleitoral.');
  return Object.fromEntries(Object.entries(positivos).map(([id, v]) => [id, (v / total) * 100]));
}

/**
 * Executa simulações com perturbações locais e nacionais sobre o apoio fornecido.
 * entrada: { candidatos:[{id,nome}], estados:[{uf,peso,apoio:{id:percentual, indecisos:percentual}}], seed, quantidade }
 */
function simularSalaGuerra({ candidatos, estados, seed = 20261018, quantidade = SIMULACOES_PADRAO }) {
  if (!Array.isArray(candidatos) || candidatos.length < 2) throw new Error('A simulação exige ao menos dois candidatos.');
  if (!Array.isArray(estados) || estados.length < 1) throw new Error('A simulação exige estados com dados de apoio.');
  if (!Number.isInteger(seed)) throw new Error('A semente da simulação precisa ser um inteiro.');
  if (!Number.isInteger(quantidade) || quantidade < 1 || quantidade > 10000) throw new Error('Quantidade de simulações inválida.');
  const ids = candidatos.map((c) => c.id);
  if (new Set(ids).size !== ids.length || ids.some((id) => !id || id === 'indecisos')) throw new Error('Identificadores de candidatos inválidos.');
  for (const e of estados) {
    if (!e.uf || !(Number.isFinite(e.peso) && e.peso > 0) || !e.apoio) throw new Error('Estado ou peso inválido na simulação.');
    for (const id of ids) if (!(Number.isFinite(e.apoio[id]) && e.apoio[id] >= 0)) throw new Error(`Apoio inválido para ${id} em ${e.uf}.`);
  }

  const totaisNacionais = Object.fromEntries(ids.map((id) => [id, 0]));
  const vitoriasPrimeiroTurno = Object.fromEntries(ids.map((id) => [id, 0]));
  const liderancas = Object.fromEntries(ids.map((id) => [id, 0]));
  const finalistas = Object.fromEntries(ids.map((id) => [id, 0]));
  const distribuicao = Object.fromEntries(ids.map((id) => [id, []]));
  const paresSegundoTurno = {};
  let semMaioriaAbsoluta = 0;
  const resultados = [];

  for (let rodada = 0; rodada < quantidade; rodada++) {
    const rng = criarRng((seed + Math.imul(rodada + 1, 2654435761)) >>> 0);
    // Um choque nacional afeta a campanha inteira; cada estado recebe um choque próprio.
    const choqueNacional = Object.fromEntries(ids.map((id) => [id, normalAproximada(rng) * 0.65]));
    const votos = Object.fromEntries(ids.map((id) => [id, 0]));
    let totalPeso = 0;

    for (const estado of estados) {
      const apoio = estado.apoio;
      const indecisos = Math.max(0, Number(apoio.indecisos ?? 0));
      const base = {};
      for (const id of ids) {
        const volatilidade = 1.4 + Math.sqrt(indecisos) * 0.32;
        base[id] = Math.max(0.05, apoio[id] + choqueNacional[id] + normalAproximada(rng) * volatilidade);
      }
      // Parte dos indecisos é redistribuída de forma proporcional, com pequena inclinação aleatória.
      const alocacaoIndecisos = indecisos * (0.35 + rng() * 0.4);
      const somaBase = Object.values(base).reduce((a, b) => a + b, 0);
      for (const id of ids) base[id] += alocacaoIndecisos * (base[id] / somaBase);
      const percentuais = normalizar(base);
      const participacao = estado.peso * (0.94 + rng() * 0.12);
      totalPeso += participacao;
      for (const id of ids) votos[id] += percentuais[id] * participacao;
    }

    const shares = Object.fromEntries(ids.map((id) => [id, (votos[id] / totalPeso)]));
    const ordenados = [...ids].sort((a, b) => shares[b] - shares[a] || a.localeCompare(b));
    const lider = ordenados[0];
    liderancas[lider]++;
    if (shares[lider] > 50) vitoriasPrimeiroTurno[lider]++;
    else {
      semMaioriaAbsoluta++;
      finalistas[ordenados[0]]++;
      finalistas[ordenados[1]]++;
      const par = [ordenados[0], ordenados[1]].sort().join('|');
      paresSegundoTurno[par] = (paresSegundoTurno[par] ?? 0) + 1;
    }
    for (const id of ids) {
      totaisNacionais[id] += shares[id];
      distribuicao[id].push(shares[id]);
    }
    resultados.push({ lider, shares });
  }

  const media = Object.fromEntries(ids.map((id) => [id, totaisNacionais[id] / quantidade]));
  const resumo = candidatos.map((c) => {
    const valores = [...distribuicao[c.id]].sort((a, b) => a - b);
    return {
      id: c.id,
      nome: c.nome,
      media: media[c.id],
      liderancaPct: (liderancas[c.id] / quantidade) * 100,
      maioriaPrimeiroTurnoPct: (vitoriasPrimeiroTurno[c.id] / quantidade) * 100,
      finalistaPct: (finalistas[c.id] / quantidade) * 100,
      p10: valores[Math.floor((valores.length - 1) * 0.10)],
      p90: valores[Math.floor((valores.length - 1) * 0.90)],
    };
  }).sort((a, b) => b.media - a.media);

  return {
    quantidade,
    seed,
    semMaioriaAbsoluta,
    semMaioriaAbsolutaPct: (semMaioriaAbsoluta / quantidade) * 100,
    candidatos: resumo,
    paresSegundoTurno: Object.entries(paresSegundoTurno)
      .map(([par, ocorrencias]) => ({ ids: par.split('|'), ocorrencias, percentual: (ocorrencias / quantidade) * 100 }))
      .sort((a, b) => b.ocorrencias - a.ocorrencias),
    resultados,
  };
}

return { SIMULACOES_PADRAO, simularSalaGuerra };
})();

// ---- Backup: exportar e importar a partida em arquivo JSON ----
function validarPartida(obj) {
  const erro = (m) => { throw new Error(m); };
  if (!obj || typeof obj !== 'object') erro('arquivo não é uma partida.');
  if (obj.versao !== 1) erro('versão de partida não suportada.');
  if (!Number.isInteger(obj.seed)) erro('semente ausente.');
  if (!['campanha', 'votacao', 'encerrada'].includes(obj.fase)) erro('fase desconhecida.');
  if (!Array.isArray(obj.candidatos) || obj.candidatos.length < 2) erro('lista de candidatos inválida.');
  if (!Number.isInteger(obj.semana) || obj.semana < 1 || obj.semana > 14) erro('semana inválida.');
  if (!(obj.energia >= 0 && obj.energia <= 10)) erro('energia inválida.');
  if (!(Number.isFinite(obj.caixa) && obj.caixa >= 0)) erro('caixa inválida.');
  if (obj.fase === 'encerrada' && !obj.resultado) erro('partida encerrada sem resultado.');
  // Cada estado precisa ter todos os candidatos e os indecisos, com números válidos.
  const ids = [...obj.candidatos.map((c) => c.id), 'indecisos'];
  if (!obj.apoio || Object.keys(obj.apoio).length !== 27) erro('estados incompletos.');
  for (const [uf, linha] of Object.entries(obj.apoio)) {
    if (!Object.prototype.hasOwnProperty.call(linha, 'brancos_nulos')) { for (const k of Object.keys(linha)) linha[k] *= 0.9; linha.brancos_nulos = 10; }
    for (const id of ids) {
      const v = linha[id];
      if (!(Number.isFinite(v) && v >= 0)) erro(`apoio inválido em ${uf}.`);
    }
  }
  return obj;
}

function exportarRanking() {

  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportarPartida() {
  if (!partida) { msg = 'Não há partida aberta para exportar.'; return render(); }
  const nome = (partida.candidatos[0].nome || 'partida').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const blob = new Blob([JSON.stringify(partida, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `planalto-${nome}-semana${partida.semana}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    try {
      const mesclado = mesclarRanking(lerRanking(), JSON.parse(await arq.text()));

    } catch (e) {
      msg = `Não foi possível importar o ranking: ${e.message}`;

    return render();
  }
  if (!ev.target || ev.target.id !== 'importar') return;
  const arquivo = ev.target.files && ev.target.files[0];
  if (!arquivo) return;
  try {

});

// Registra a partida no ranking quando ela chega ao fim. Idempotente: não duplica pontos.
function registrarSeFinal() {
  if (!partida || !partida.resultado) return null;
  const terminou = !partida.governo || partida.governo.fase === 'carreira_encerrada';
  if (!terminou) return null;
  const lista = lerRanking();
  const r = registrarNoRanking(lista, partida);
  if (r.lista !== lista) gravarRanking(r.lista);
  const hist = lerHistorico();
  const h = registrarNoHistorico(hist, partida);
  if (h.novo) gravarHistorico(h.lista);
  return r.entrada ?? null;
}

  return `

      <div class="log">${linhas || '<p class="aviso">Sem pontos registrados.</p>'}</div>

      ${cards || '<p class="aviso">Nenhuma conquista ainda.</p>'}

}

// ---- Gráfico de evolução (SVG simples, sem bibliotecas) ----
function grafico(series, { titulo, maximo = 100, legenda = '' } = {}) {
  const W = 560, H = 200, P = 34;
  const n = Math.max(0, ...series.map((x) => x.valores.length));
  if (n < 2) {
    return `<p class="aviso">${esc(titulo)}: o gráfico aparece quando houver pelo menos dois pontos.</p>`;
  }
  const x = (i) => P + (i * (W - 2 * P)) / (n - 1);
  const y = (v) => H - P - (Math.min(maximo, Math.max(0, v)) / maximo) * (H - 2 * P);
  const linhas = series.map((ser) => {
    const pts = ser.valores.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const ultimo = ser.valores[ser.valores.length - 1];
    return `<polyline points="${pts}" fill="none" stroke="${ser.cor}" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="${(W - P + 4)}" y="${y(ultimo).toFixed(1)}" font-size="11" fill="${ser.cor}" dominant-baseline="middle">${esc(ser.nome)} ${Number(ultimo).toFixed(0)}</text>`;
  }).join('');
  const eixo = [0, maximo / 2, maximo].map((v) => `<g><line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#2b3b46" stroke-dasharray="3 3"/><text x="${P - 6}" y="${y(v)}" font-size="10" fill="#8ea3b0" text-anchor="end" dominant-baseline="middle">${v}</text></g>`).join('');
  return `
    <figure style="margin:0">
      <figcaption class="aviso">${esc(titulo)}${legenda ? ' · ' + esc(legenda) : ''}</figcaption>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}" style="width:100%;max-width:${W}px;height:auto">
        ${eixo}${linhas}
      </svg>
    </figure>`;
}

// Evolução das pesquisas: você e o adversário mais bem colocado em cada pesquisa publicada.
function graficoPesquisas(p) {
  const pesq = p.pesquisas ?? [];
  const eu = pesq.map((q) => q.resultados.jogador ?? 0);
  const rival = pesq.map((q) => Math.max(0, ...Object.entries(q.resultados)
    .filter(([k]) => k !== 'jogador' && k !== 'indecisos').map(([, v]) => v)));
  return grafico([
    { nome: 'Você', cor: '#f2b632', valores: eu },
    { nome: 'Líder adversário', cor: '#8ea3b0', valores: rival },
  ], { titulo: 'Evolução nas pesquisas', legenda: '% por pesquisa publicada' });
}

function renderJogo() {
  const p = partida;
  const nacional = C.pesquisaNacional(p);
  const lista = p.candidatos.map((c) => ({ id: c.id, nome: c.nome, valor: nacional[c.id] ?? 0 }))
    .sort((a, b) => b.valor - a.valor);
  const topo = lista.filter((x) => x.id !== 'jogador').slice(0, 4);
  const eu = lista.find((x) => x.id === 'jogador');
  const indec = { id: 'indecisos', nome: 'Indecisos', valor: nacional.indecisos ?? 0 };
  const mostrar = [...topo, eu, indec].sort((a, b) => b.valor - a.valor);

  const mapa = ESTADOS.map((e) => {
    const v = C.pesquisaUf(p, e.uf).jogador ?? 0;
    const alfa = Math.min(1, v / 35).toFixed(2);
    return `<button class="uf ${ufSel === e.uf ? 'sel' : ''}" data-uf="${e.uf}"
      style="grid-row:${e.linha + 1};grid-column:${e.coluna + 1};background:rgba(47,158,110,${alfa})"
      title="${esc(e.nome)}" aria-label="${esc(e.nome)}, ${v} por cento de apoio"${p.aliancas?.[e.uf] ? ' aria-pressed="true"' : ''}>${e.uf}${p.aliancas?.[e.uf] ? ' ★' : ''}<small>${v}%</small></button>`;
  }).join('');

  const K = { comicio: C.custoDaAcao(p, 'comicio'), caminhada: C.custoDaAcao(p, 'caminhada'), rede: C.custoDaAcao(p, 'rede'), responder: C.custoDaAcao(p, 'responder'), alianca: C.custoDaAcao(p, 'alianca') };
  const podeComicio = p.energia >= K.comicio.energia && p.caixa >= K.comicio.caixa;
  const podeCaminhada = p.energia >= K.caminhada.energia && p.caixa >= K.caminhada.caixa;
  const podeRede = p.energia >= K.rede.energia && p.caixa >= K.rede.caixa;
  const debateDisponivel = C.SEMANAS_DEBATE.includes(p.semana) && !p.debates[p.semana];
  const fimCampanha = p.fase === 'votacao';
  const log = [...p.eventos].reverse().slice(0, 14)
    .map((ev) => `<div><span>S${ev.semana}</span>${esc(ev.texto)}</div>`).join('');

  const candidatosUf = GOVERNADORES[ufSel] ?? [];
  const aliadoUf = p.aliancas?.[ufSel];
  const painelAliancas = `
    <section class="painel">
      <h2>Governadores em ${ufSel}</h2>
      ${aliadoUf ? `<p>Aliado atual: <b>${esc(aliadoUf.nome)}</b> (${esc(aliadoUf.partido)}), desde a semana ${aliadoUf.desde}. Apoio extra por semana enquanto durar.</p>` : `<p class="aviso">Sem aliado neste estado. Uma aliança custa ${C.custoDaAcao(p,'alianca').energia} de energia e ${C.custoDaAcao(p,'alianca').caixa} de caixa.</p>`}
      ${candidatosUf.map((c) => `
        <button data-acao="alianca" data-candidato="${esc(c.id)}"
          ${p.energia >= C.custoDaAcao(p,'alianca').energia && p.caixa >= C.custoDaAcao(p,'alianca').caixa && (!aliadoUf || aliadoUf.id !== c.id) ? '' : 'disabled'}>
          ${FOTOS[c.id] ? `<img src="${FOTOS[c.id]}" alt="" width="32" height="32" style="border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px">` : ''}${esc(c.nome)} (${esc(c.partido)}, ${esc(c.numero)})${aliadoUf && aliadoUf.id === c.id ? ' ✓' : ''}
        </button>`).join('')}
      <p class="aviso">Candidatos a governador do registro do TSE (2026). Escolher um não significa apoio do candidato.</p>
    </section>`;

  if (tutorialPasso === -1 && !tutorialVisto() && p.semana === 1 && (p.pesquisas ?? []).length === 0) tutorialPasso = 0;
  app.innerHTML = `
    ${blocoTutorial()}
    <section class="painel">
      <div class="indicadores">
        <div><span>Semana</span><b>${Math.min(p.semana, C.SEMANAS)} / ${C.SEMANAS}</b></div>
        <div><span>Energia</span><b>${p.energia} / ${p.params?.energiaMax ?? C.ENERGIA_MAX}</b></div>
        <div><span>Caixa</span><b>${p.caixa.toFixed(0)}</b></div>
        <div><span>Dificuldade</span><b>${esc({ facil: 'Fácil', normal: 'Normal', dificil: 'Difícil' }[p.dificuldade] ?? 'Normal')}</b></div>
        <div><span>${esc(p.candidatos[0].nome)}</span><b>${pct(eu.valor)} nacional</b></div>
      </div>
      ${p.escandaloPendente ? '<p style="color:var(--vermelho)">Há uma denúncia pendente. Responda para não perder apoio.</p>' : ''}
    </section>
    <div class="grade">
      <section class="painel">
        <h2>Pesquisas</h2>
        ${pesquisaPublicada(p)}
        ${graficoPesquisas(p)}
      </section>
      <section class="painel">
        <h2>Mapa: clique em um estado</h2>
        <div class="mapa">${mapa}</div>
        <p class="aviso">Cor mais forte = mais apoio ao seu candidato. Pesos dos estados são fictícios.</p>
      </section>
    </div>
    ${fimCampanha ? '' : painelAliancas}
    ${renderSalaGuerra(p)}
    <section class="painel">
      <h2>Ações de campanha${fimCampanha ? '' : ` em ${ufSel}`}</h2>
      ${fimCampanha ? '' : `
        <button data-acao="comicio" ${podeComicio ? '' : 'disabled'}>Comício em ${ufSel} (${K.comicio.energia} energia, ${K.comicio.caixa} caixa)</button>
        <button data-acao="caminhada" ${podeCaminhada ? '' : 'disabled'}>Caminhada em ${ufSel} (${K.caminhada.energia} energia, ${K.caminhada.caixa} caixa)</button>
        <button data-acao="rede" ${podeRede ? '' : 'disabled'}>Redes sociais (${K.rede.energia} energia, ${K.rede.caixa} caixa)</button>

          <p>Debate desta semana:</p>

        ${p.escandaloPendente ? `<button data-acao="responder" ${p.energia >= K.responder.energia && p.caixa >= K.responder.caixa ? '' : 'disabled'}>Responder à denúncia (${K.responder.energia} energia, ${K.responder.caixa} caixa)</button>` : ''}
        <p></p>

    </section>
    <div class="grade">
      <section class="painel"><h2>Acontecimentos</h2><div class="log">${log || '<p class="aviso">Nada registrado ainda.</p>'}</div></section>
      <section class="painel"><h2>Partida</h2>

        <button data-acao="exportar">Baixar backup</button>
        ${botaoImportar}
        <button class="perigo" data-acao="apagar">Apagar esta partida</button>
      </section>
    </div>`;
}

function renderResultado() {
  const r = partida.resultado;
  const totais = Object.entries(r.primeiroTurno.totais)
    .map(([id, v]) => ({ id, nome: partida.candidatos.find((c) => c.id === id).nome, v }))
    .sort((a, b) => b.v - a.v);
  const validos = r.primeiroTurno.validos;
  const lista = totais.map((t) => ({ id: t.id, nome: t.nome, valor: (t.v / validos) * 100 }));
  const eleito = partida.candidatos.find((c) => c.id === r.vencedor);
  const euVenceu = r.vencedor === 'jogador';
  const linhasUf = r.primeiroTurno.porEstado.map((e) => {
    const nome = partida.candidatos.find((c) => c.id === e.vencedor)?.nome ?? '?';
    return `<tr><td>${e.uf}</td><td>${esc(nome)}</td></tr>`;
  }).join('');
  // Mapa colorido: cada estado com a cor do vencedor. Você em dourado; os demais em tons distintos.
  const paleta = ['#8ea3b0', '#2f9e6e', '#4f7fd1', '#c06ad1', '#d1794f', '#52c4c4', '#a0a84c', '#e06c8c', '#7a6fd1', '#c9b26b', '#6fa3c9', '#b5715d', '#5fbf8c', '#9d6bb0'];
  const corDe = {};
  partida.candidatos.filter((c) => c.id !== 'jogador').forEach((c, i) => { corDe[c.id] = paleta[i % paleta.length]; });
  corDe.jogador = '#f2b632';
  const mapaResultado = `
    <div class="mapa" role="img" aria-label="Mapa do resultado por estado">
      ${r.primeiroTurno.porEstado.map((e) => {
        const nome = partida.candidatos.find((c) => c.id === e.vencedor)?.nome ?? '?';
        return `<div class="uf" style="grid-row:${ESTADOS.find((x) => x.uf === e.uf).linha + 1};grid-column:${ESTADOS.find((x) => x.uf === e.uf).coluna + 1};background:${corDe[e.vencedor] ?? '#444'};color:#111" title="${esc(e.uf)}: ${esc(nome)}" aria-label="${esc(e.uf)}: ${esc(nome)}">${e.uf}</div>`;
      }).join('')}
    </div>
    <p class="aviso">Cada estado tem a cor do vencedor. Você aparece em dourado.</p>`;
  const seg = r.segundoTurno
    ? `<p>Houve segundo turno entre <b>${esc(partida.candidatos.find((c) => c.id === r.segundoTurno.finalistas[0]).nome)}</b> e <b>${esc(partida.candidatos.find((c) => c.id === r.segundoTurno.finalistas[1]).nome)}</b>.</p>`
    : '<p>Vitória no primeiro turno, com mais da metade dos votos válidos.</p>';

  app.innerHTML = `
    <section class="painel">
      <h1>${euVenceu ? 'Você venceu a eleição' : 'Resultado da eleição'}</h1>
      <div class="vencedor">${esc(eleito.nome)} ${eleito.partido ? `(${esc(eleito.partido)})` : ''}</div>
      ${seg}
      <h2>Votos válidos (1º turno)</h2>
      ${barras(lista, 'jogador')}
    </section>
    <div class="grade">
      <section class="painel"><h2>Vencedor por estado (1º turno)</h2>
        ${mapaResultado}
        <div class="tabela-rolavel"><table><tr><th>UF</th><th>Vencedor</th></tr>${linhasUf}</table></div>
      </section>
      ${blocoPontuacao()}
      <section class="painel"><h2>Partida</h2>
        ${euVenceu ? '<button class="primario" data-acao="posse">Tomar posse e governar</button>' : ''}
        <button class="perigo" data-acao="apagar">Nova partida</button>
      </section>
    </div>`;
}

function renderTela() {
  // Telas de apoio abrem de qualquer lugar; o botão Voltar retorna à partida ou ao início.
  if (tela === 'ranking') return renderRankingTela();
  if (tela === 'conquistas') return renderConquistasTela();
  if (tela === 'novidades') return renderNovidadesTela();
  if (tela === 'tutorial') return renderTutorialTela();
  if (tela === 'estatisticas') return renderEstatisticasTela();
  if (!partida) return renderInicio();
  if (partida.governo && partida.governo.fase === 'carreira_encerrada') return renderCarreira();
  if (partida.governo) return renderGoverno();
  if (partida.fase === 'encerrada') return renderResultado();
  return renderJogo();
}

// Se uma tela falhar, mostra a causa e mantém a partida salva, em vez de deixar a página vazia.
function render() {
  document.documentElement.dataset.jogo = 'ok';
  aplicarContraste();
  try {
    registrarSeFinal();
    renderTela();
  } catch (e) {
    app.innerHTML = `
      <section class="painel">
        <h2>Esta tela não pôde ser mostrada</h2>
        <p>Causa: ${esc(e && e.message ? e.message : e)}</p>
        <p class="aviso">Sua partida continua salva. Tente voltar à partida; se o problema continuar, me envie esta mensagem.</p>
        <button class="primario" data-acao="tentar">Tentar novamente</button>
        <button class="perigo" data-acao="apagar">Apagar esta partida</button>
      </section>`;
    console.error(e);
  }
}

// ---- Painel presidencial (redesenho 0.17) ----
const MESES_CURTOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function calendarioDoJogo(mes) {
  const idx = (mes - 1) % 12;
  const ano = 2027 + Math.floor((mes - 1) / 12);
  return { rotulo: `${MESES_CURTOS[idx]}/${ano}`, mes: idx, ano };
}
function tendencia(atual, anterior) {
  if (anterior === undefined || anterior === null) return '<span class="tend neutra">sem histórico</span>';
  const d = atual - anterior;
  if (Math.abs(d) < 0.05) return '<span class="tend neutra">■ estável</span>';
  return d > 0
    ? `<span class="tend alta">▲ ${d.toFixed(1)} pts</span>`
    : `<span class="tend queda">▼ ${Math.abs(d).toFixed(1)} pts</span>`;
}
function renderResumoFiscal(g) {
  const f = g.fiscal ?? G.criarPainelFiscal();
  const sinal = (n) => `${n > 0 ? '+' : ''}${Number(n).toFixed(1)} bi`;
  const resultado = f.resultadoNominal ?? (f.resultadoPrimario - f.juros);
  return `<section class="painel fiscal-resumo" id="sec-fiscal">
    <div class="cabecalho-painel"><h2>Contas públicas</h2><span class="pill">valores fictícios do jogo</span></div>
    <div class="fiscal-kpis">
      <div class="fiscal-item"><span>Receita mensal</span><b>R$ ${Number(f.receita).toFixed(1)} bi</b></div>
      <div class="fiscal-item"><span>Despesa mensal</span><b>R$ ${Number(f.despesa).toFixed(1)} bi</b></div>
      <div class="fiscal-item"><span>Resultado primário</span><b class="${f.resultadoPrimario >= 0 ? 'fiscal-positivo' : 'fiscal-negativo'}">${sinal(f.resultadoPrimario)}</b></div>
      <div class="fiscal-item"><span>Juros estimados</span><b>R$ ${Number(f.juros).toFixed(1)} bi</b></div>
      <div class="fiscal-item"><span>Resultado nominal</span><b class="${resultado >= 0 ? 'fiscal-positivo' : 'fiscal-negativo'}">${sinal(resultado)}</b></div>
    </div>
    <p class="aviso">Estimativa simplificada da simulação: economia, dívida e orçamento influenciam os números a cada mês. Não são dados oficiais nem projeções econômicas reais.</p>
  </section>`;
}

function painelPresidencial(g, fim) {
  const i = g.indicadores;
  const hist = g.historicoAprovacao ?? [];
  const aprovAnterior = hist.length >= 2 ? hist[hist.length - 2] : undefined;
  const mesAtual = Math.min(g.mes, G.MESES_GOVERNO);
  const cal = calendarioDoJogo(mesAtual);
  const restantes = Math.max(0, G.MESES_GOVERNO - g.mes + 1);
  const areas = [
    ['sec-fiscal', 'Painel fiscal'], ['sec-crises', 'Crises'], ['sec-orcamento', 'Orçamento'], ['sec-medidas', 'Medidas'],
    ['sec-congresso', 'Congresso'], ['sec-grupos', 'Grupos sociais'], ['sec-ministerios', 'Ministérios'], ['sec-federacao', 'Governadores'], ['sec-estatais', 'Estatais'], ['sec-historico', 'Histórico'], ['sec-grafico', 'Aprovação'],
  ].map(([id, rot]) => `<a class="chip" href="#${id}">${rot}</a>`).join('');
  const noticias = [...g.eventos].reverse().slice(0, 6)
    .map((e) => `<li><span>M${e.mes}</span> ${esc(e.texto)}</li>`).join('');
  const decisoes = (g.crises ?? []).map((c) => `<li><b>${esc(c.titulo)}</b>: ${c.restante} ${c.restante === 1 ? 'mês' : 'meses'} restantes${c.respondida ? ' (respondida)' : ''}</li>`).join('')
    || '<li class="aviso">Nenhuma crise em curso.</li>';
  const proximos = [];
  for (let k = 1; k <= 6; k++) {
    const m = mesAtual + k;
    if (m > G.MESES_GOVERNO) break;
    proximos.push(`<li><span>${calendarioDoJogo(m).rotulo}</span> mês ${m} de ${G.MESES_GOVERNO}</li>`);
  }
  if (!fim) proximos.push(`<li><span>${calendarioDoJogo(G.MESES_GOVERNO).rotulo}</span> fim do mandato: ${G.MESES_GOVERNO} meses</li>`);
  return `
    <nav class="areas" aria-label="Áreas do governo">${areas}</nav>
    <section class="painel" id="sec-painel">
      <div class="cabecalho-painel">
        <h1>Governo${g.mandatoNumero > 1 ? ` (${g.mandatoNumero}º mandato)` : ''}${fim ? ' encerrado' : ''}</h1>
        <span class="pill">${esc(cal.rotulo)}</span>
      </div>
      <p class="aviso">Calendário do jogo (fictício): mês 1 é janeiro de 2027.${fim ? '' : ` Faltam ${restantes} ${restantes === 1 ? 'mês' : 'meses'} de mandato.`}</p>
      <div class="kpis">
        <div class="kpi destaque"><span>Aprovação</span><b>${i.aprovacao.toFixed(0)}%</b>${tendencia(i.aprovacao, aprovAnterior)}</div>
        <div class="kpi"><span>Crescimento (PIB)</span><b>${i.pib.toFixed(1)}%</b><small class="tend neutra">ao ano, simulado</small></div>
        <div class="kpi"><span>Inflação</span><b>${i.inflacao.toFixed(1)}%</b><small class="tend neutra">ao ano, simulado</small></div>
        <div class="kpi"><span>Desemprego</span><b>${i.desemprego.toFixed(1)}%</b><small class="tend neutra">simulado</small></div>
        <div class="kpi"><span>Dívida (% PIB)</span><b>${i.divida.toFixed(0)}</b><small class="tend neutra">simulado</small></div>
      </div>
      ${renderResumoFiscal(g)}
      <div class="duas-colunas">
        <div id="sec-grafico">${graficoAprovacao(g)}</div>
        <div><h2>Próximas decisões</h2><ul class="lista">${decisoes}</ul></div>
      </div>
    </section>
    <div class="grade">
      <section class="painel"><h2>Notícias do governo</h2><ul class="lista">${noticias || '<li class="aviso">Sem notícias ainda.</li>'}</ul></section>
      <section class="painel"><h2>Calendário</h2><ul class="lista">${proximos.join('')}</ul></section>
    </div>`;
}

function renderGoverno() {
  const g = partida.governo;
  const i = g.indicadores;
  const fim = g.fase === 'encerrado';
  const bancadas = G.bancadas(g, 'camara').slice(0, 8)
    .map(([nome, n]) => ({ id: nome, nome: `${nome} (${n})`, valor: (n / G.CADEIRAS) * 100 }));
  const senadoPorPartido = G.bancadas(g, 'senado').slice(0, 4)
    .map(([p, n]) => `${p} ${n}`).join(', ');
  const refPL = BANCADAS_REFERENCIA.find((b) => b.rotulo === 'PL')?.cadeiras;
  const medidas = [...g.medidas].reverse().slice(0, 12).map((m) => {
    const nominal = ['camara', 'senado'].map((casa) => {
      const v = m.votos?.[casa];
      if (!v?.nominais?.length) return '';
      const nomeCasa = casa === 'camara' ? 'Câmara' : 'Senado';
      const lista = v.nominais.map((p) => `<div class="voto-nominal"><span>${esc(p.nome)}</span><small>${esc(p.partido)} · ${esc(p.uf)}</small><b class="voto-${p.voto}">${p.voto === 'sim' ? 'SIM' : 'NÃO'}</b></div>`).join('');
      return `<details class="votacao-nominal"><summary>${nomeCasa}: ${v.sim} SIM · ${v.nao} NÃO · ver votos nominais (${v.nominais.length})</summary><div class="lista-votos">${lista}</div></details>`;
    }).join('');
    return `<div class="medida-registro"><span>Mês ${m.mes} · ${esc(m.instrumento)}</span> ${esc(m.texto)}<br>
      <small>${esc(m.resultado)}</small><br><small><b>Situação:</b> ${esc(G.situacaoDaMedida(m))}</small>${nominal}</div>`;
  }).join('');
  const eventos = [...g.eventos].reverse().slice(0, 12)
    .map((e) => `<div><span>M${e.mes}</span>${esc(e.texto)}</div>`).join('');

  app.innerHTML = `
    ${painelPresidencial(g, fim)}
    ${fim ? renderFimMandato(g) : `
      <details class="secao-governo" id="sec-crises"><summary>Crises e respostas</summary>${renderCrises(g)}</details>
      <details class="secao-governo" id="sec-orcamento"><summary>Orçamento</summary>${renderOrcamento(g)}</details>
      <details class="secao-governo" id="sec-medidas"><summary>Medidas e decretos</summary>
        <section class="painel">
          <h2>Protocolar medida</h2>
          <label for="medida">Descreva a medida com suas palavras (instrumento e custo são classificados automaticamente)</label>
          <textarea id="medida" rows="4" style="width:100%;background:#0e1418;color:var(--texto);border:1px solid #3d5160;border-radius:6px;padding:8px;font:inherit"
            placeholder="Ex.: Programa nacional de saneamento de R$ 4 bilhões financiado por imposto sobre lucros de bancos">${esc(previsaoMedida?.texto ?? '')}</textarea>
          <div class="acoes-medida">
            <button data-acao="analisar-medida">Analisar despacho</button>
            <button class="primario" data-acao="protocolar">Protocolar medida</button>
            <button data-acao="mes">Encerrar mês</button>
          </div>
          ${previsaoMedida ? `<section class="previsao-medida" aria-live="polite">
            <div class="previsao-topo"><span class="eyebrow">Prévia do despacho · não altera a partida</span><b class="pill">${esc(previsaoMedida.instrumento)}</b></div>
            <h3>${esc(previsaoMedida.texto)}</h3>
            <div class="previsao-grade">
              <div><span>Instrumento provável</span><b>${esc(previsaoMedida.instrumento)}</b></div>
              <div><span>Custo identificado no texto</span><b>${previsaoMedida.custo > 0 ? `R$ ${previsaoMedida.custo.toLocaleString('pt-BR')} bi` : 'Não identificado'}</b></div>
              <div><span>Fonte de recursos</span><b>${previsaoMedida.temFonte ? 'Mencionada no texto' : 'Não identificada'}</b></div>
              <div><span>Leva ao Congresso?</span><b>${previsaoMedida.instrumento === 'decreto' ? 'Não, em regra' : 'Sim, simulação de votação'}</b></div>
            </div>
            <p>${esc(previsaoMedida.resumo)}</p>
            <p class="aviso">Esta análise usa palavras-chave e regras simplificadas do jogo; não é parecer jurídico nem estimativa orçamentária real. A aprovação não está garantida.</p>
          </section>` : ''}
          <div class="msg">${esc(msg)}</div>
        </section>
      </details>
      <details class="secao-governo" id="sec-grupos"><summary>Opinião pública por grupo social</summary>
        <section class="painel">
          <h2>Aprovação segmentada</h2>
          <p class="aviso">Indicadores fictícios do simulador. Medidas aplicadas, respostas a crises e a situação econômica alteram as barras; a média influencia levemente a aprovação geral. Não são pesquisas reais.</p>
          <div class="grupos-sociais">${(g.gruposSociais ?? []).map((grupo) => `<div class="grupo-social"><div><b>${esc(grupo.nome)}</b><span>${Number(grupo.aprovacao).toFixed(1)}%</span></div><div class="barra-grupo"><i style="width:${Math.max(0, Math.min(100, Number(grupo.aprovacao) || 0))}%"></i></div></div>`).join('') || '<p class="aviso">Os grupos serão inicializados nesta partida.</p>'}</div>
        </section>
      </details>
      <details class="secao-governo" id="sec-ministerios"><summary>Ministérios e equipe</summary>
        <section class="painel"><h2>Composição ministerial</h2>
          <p class="aviso">Nomes e efeitos são definidos pelo jogador e pela simulação; não representam nomeações reais.</p>
          <div class="lista-ministerios">${(g.ministros ?? G.MINISTERIOS.map((p, idx) => ({ id: `min-${idx}`, pasta: p, nome: null, confianca: 50 }))).map((m) => `<div class="item-sistema"><div><b>${esc(m.pasta)}</b><small>${m.nome ? `Ministro(a): ${esc(m.nome)}` : 'Cargo vago'} · confiança simulada ${m.confianca}%</small></div><button data-acao="nomear-ministro" data-pasta="${esc(m.pasta)}">${m.nome ? 'Substituir' : 'Nomear'}</button></div>`).join('')}</div>
        </section>
      </details>
      <details class="secao-governo" id="sec-federacao"><summary>Relações com os estados</summary>
        <section class="painel"><h2>Negociar com governos estaduais</h2>
          <p class="aviso">Governadores e níveis de apoio são abstrações fictícias. Não representam a posição de titulares reais.</p>
          <div class="form-sistema"><label for="gov-uf">Estado</label><select id="gov-uf">${G.UFS_GOVERNO.map((uf) => `<option value="${uf}">${uf}</option>`).join('')}</select><label for="gov-proposta">Tipo de negociação</label><select id="gov-proposta"><option value="cooperacao">Cooperação administrativa</option><option value="investimento">Pacto de investimento (impacta dívida)</option><option value="confronto">Confronto público</option></select><button class="primario" data-acao="negociar-governador">Realizar negociação</button></div>
          <div class="grade grade-sistema">${(g.governadores ?? G.UFS_GOVERNO.map((uf) => ({ uf, apoio: 0, negociacoes: 0 }))).map((x) => `<div class="item-sistema"><b>${x.uf}</b><span>Apoio ${x.apoio > 0 ? '+' : ''}${x.apoio}</span><small>${x.negociacoes}/4 negociações</small></div>`).join('')}</div>
        </section>
      </details>
      <details class="secao-governo" id="sec-estatais"><summary>Empresas estatais</summary>
        <section class="painel"><h2>Gestão das empresas públicas</h2><p class="aviso">Empresas e indicadores são fictícios; não correspondem a empresas reais nem a dados contábeis oficiais.</p>
          <div class="grade grade-sistema">${(g.estatais ?? G.ESTATAIS_INICIAIS).map((e) => `<article class="estatal-card"><h3>${esc(e.nome)}</h3><p>Caixa simulado: ${e.caixa}</p><p>Eficiência: <b>${e.eficiencia}/100</b></p><p>Reputação: <b>${e.reputacao}/100</b></p><div class="acoes-estatal"><button data-acao="estatal" data-id="${esc(e.id)}" data-tipo="investir">Investir</button><button data-acao="estatal" data-id="${esc(e.id)}" data-tipo="modernizar">Modernizar</button><button data-acao="estatal" data-id="${esc(e.id)}" data-tipo="auditar">Auditar</button></div></article>`).join('')}</div>
        </section>
      </details>
      <details class="secao-governo" id="sec-congresso"><summary>Congresso Nacional</summary>
        <section class="painel">
          <h2>Câmara (513 deputados, dados reais)</h2>
          ${barras(bancadas, 'x')}
          <p class="aviso">Lei: 257 votos na Câmara e 41 no Senado. PEC: 308 e 49. As afinidades de cada parlamentar com o governo são fictícias.</p>
          <p class="aviso">Senado (81): ${esc(senadoPorPartido)}.</p>
          <p class="aviso">Atenção: o resumo de bancadas enviado não confere com a lista de deputados (ex.: PL ${refPL ?? '?'} no resumo, ${G.bancadas(g,'camara').find(([p])=>p==='PL')?.[1] ?? '?'} na lista). Usamos a lista de deputados.</p>
        </section>
      </details>
      <details class="secao-governo" id="sec-historico"><summary>Histórico de medidas e acontecimentos</summary>
        <div class="grade">
          <section class="painel"><h2>Medidas</h2><div class="log">${medidas || '<p class="aviso">Nenhuma medida protocolada.</p>'}</div></section>
          <section class="painel"><h2>Acontecimentos</h2><div class="log">${eventos || '<p class="aviso">Nada registrado ainda.</p>'}</div></section>
        </div>
      </details>`}
    <p class="aviso">Ficção. Os resultados da Câmara e da economia são simulação, não previsão. O cadastro de partidos refere-se às legendas registradas no TSE; nem todas tiveram candidatura presidencial em 2026.</p>`;
}

document.addEventListener('click', (ev) => {
  let chip = null;
  try { chip = ev.target.closest('a.chip[href^="#sec-"]'); } catch { /* ambiente de teste simplificado */ }
  if (chip) { const alvo = document.querySelector(chip.getAttribute('href')); if (alvo?.tagName === 'DETAILS') alvo.open = true; }
  const uf = ev.target.closest('[data-uf]');
  if (uf) { ufSel = uf.dataset.uf; msg = ''; render(); return; }
  const el = ev.target.closest('[data-acao]');
  if (!el || el.disabled) return;
  const acao = el.dataset.acao;
  if (acao === 'nova') {
    tela = null;
    const nome = document.getElementById('nome').value;
    const partido = document.getElementById('partido').value;
    const vice = document.getElementById('vice').value;
    const dificuldade = document.getElementById('dificuldade')?.value || 'normal';
    const seed = Math.floor(Math.random() * 2147483647);
    const normalizar = (v) => String(v ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const nomeNormalizado = normalizar(nome);
    const adversariosPartida = adversarios.filter((c) => !(String(c.partido).toUpperCase() === String(partido).toUpperCase() && (normalizar(c.nome) === nomeNormalizado || nomeNormalizado.includes(normalizar(c.nome)) || normalizar(c.nome).includes(nomeNormalizado))));
    return agir(() => C.criarPartida({ seed, jogador: { nome, partido, vice }, adversarios: adversariosPartida, dificuldade }));
  }
  if (acao === 'tentar') return render();
  if (acao === 'ver-ranking') { tela = 'ranking'; return render(); }
  if (acao === 'ver-conquistas') { tela = 'conquistas'; return render(); }
  if (acao === 'ver-novidades') { tela = 'novidades'; return render(); }
  if (acao === 'ver-tutorial') { tela = 'tutorial'; return render(); }
  if (acao === 'ver-estatisticas') { tela = 'estatisticas'; return render(); }
  if (acao === 'filtro-ranking') { rankingFiltro = el.dataset.filtro; return render(); }
  if (acao === 'tutorial-proximo') { tutorialPasso = Math.min(PASSOS_TUTORIAL.length, tutorialPasso + 1); return render(); }
  if (acao === 'tutorial-fechar') { tutorialPasso = -1; marcarTutorialVisto(); return render(); }
  if (acao === 'voltar') { tela = null; return render(); }
  if (acao === 'exportar-ranking') return exportarRanking();
  if (acao === 'contraste') { alternarContraste(); return render(); }
  if (acao === 'exportar') return exportarPartida();
  if (acao === 'apagar') {
    if (!confirm('Apagar esta partida? Esta ação não pode ser desfeita.')) return;
    partida = null;
    try { localStorage.removeItem(CHAVE); } catch { /* ignorar */ }
    msg = '';
    return render();
  }
  if (acao === 'sala-guerra') {
    try {
      const dados = partida;
      const estados = ESTADOS.map((e) => ({ uf: e.uf, peso: e.peso, apoio: C.pesquisaUf(dados, e.uf) }));
      resultadoSalaGuerra = simularSalaGuerra({
        candidatos: dados.candidatos.map((c) => ({ id: c.id, nome: c.nome })),
        estados,
        seed: (dados.seed + dados.semana * 104729 + (dados.resultado?.primeiroTurno?.validos ?? 0)) >>> 0,
        quantidade: SIMULACOES_PADRAO,
      });
      msg = '';
    } catch (e) {
      msg = `Sala de guerra: ${e.message}`;
    }
    return render();
  }
  if (acao === 'comicio') return agir((p) => C.comicio(p, ufSel));
  if (acao === 'caminhada') return agir((p) => C.caminhada(p, ufSel));
  if (acao === 'rede') return agir((p) => C.redeSocial(p));
  if (acao === 'alianca') return agir((p) => C.alianca(p, ufSel, el.dataset.candidato));
  if (acao === 'debate') return agir((p) => C.debate(p, el.dataset.estilo));
  if (acao === 'responder') return agir((p) => C.responderDenuncia(p));
  if (acao === 'encerrar') return agir((p) => C.encerrarSemana(p));
  if (acao === 'eleger') return agir((p) => C.eleger(p));
  if (acao === 'posse') return agir((p) => ({
    ...p,
    governo: G.criarGoverno({ seed: p.seed + 1, deputados: DEPUTADOS, senadores: SENADORES, partidoDoPresidente: p.candidatos[0].partido, aliancas: p.aliancas ?? {}, dificuldade: p.dificuldade ?? 'normal' }),
  }));
  if (acao === 'analisar-medida') {
    const texto = document.getElementById('medida')?.value ?? '';
    try {
      const m = G.classificarMedida(texto);
      const resumo = m.instrumento === 'decreto'
        ? 'O motor classifica como ato administrativo. A legalidade e os limites do decreto não são verificados juridicamente.'
        : `${m.instrumento} encaminhado para votação simulada. O resultado depende da composição e afinidade das bancadas e da aprovação do governo.`;
      previsaoMedida = { ...m, resumo };
      msg = '';
    } catch (e) {
      previsaoMedida = null;
      msg = e.message;
    }
    return render();
  }
  if (acao === 'protocolar') {
    const texto = document.getElementById('medida')?.value ?? '';
    return agir((p) => {
      const governo = G.protocolarMedida(p.governo, texto);
      previsaoMedida = null;
      return { ...p, governo };
    });
  }
  if (acao === 'mes') return agir((p) => ({ ...p, governo: G.encerrarMes(p.governo) }));
  if (acao === 'orc-cortar' || acao === 'orc-ampliar') {
    const pasta = el.dataset.pasta;
    const pct = Number(el.dataset.pct) / 100;
    const atual = partida.governo.orcamento.pastas.find((x) => x.id === pasta);
    const valor = Math.round(atual.dotacao * pct * 10) / 10;
    if (acao === 'orc-cortar') return agir((p) => ({ ...p, governo: G.cortarOrcamento(p.governo, pasta, valor) }));
    return agir((p) => ({ ...p, governo: G.ampliarOrcamento(p.governo, pasta, valor, 'divida') }));
  }
  if (acao === 'orc-remanejar') {
    const origem = document.getElementById('orc-origem')?.value;
    const destino = document.getElementById('orc-destino')?.value;
    const valor = Number(document.getElementById('orc-valor')?.value);
    return agir((p) => ({ ...p, governo: G.remanejarOrcamento(p.governo, origem, destino, valor) }));
  }
  if (acao === 'nomear-ministro') {
    const pasta = el.dataset.pasta;
    const nome = prompt(`Nome para o Ministério de ${pasta}:`);
    if (nome === null) return;
    return agir((p) => ({ ...p, governo: G.nomearMinistro(p.governo, pasta, nome) }));
  }
  if (acao === 'negociar-governador') {
    const uf = document.getElementById('gov-uf')?.value;
    const proposta = document.getElementById('gov-proposta')?.value;
    return agir((p) => ({ ...p, governo: G.negociarGovernador(p.governo, uf, proposta) }));
  }
  if (acao === 'estatal') return agir((p) => ({ ...p, governo: G.gerirEstatal(p.governo, el.dataset.id, el.dataset.tipo) }));
  if (acao === 'responder-crise') return agir((p) => ({ ...p, governo: G.responderCrise(p.governo, el.dataset.uid, el.dataset.resposta || undefined) }));
  if (acao === 'reeleicao') return agir((p) => ({ ...p, governo: S.eleicaoSeguinte(p.governo, { tipo: 'reeleicao' }) }));
  if (acao === 'sucessor') {
    const nome = document.getElementById('sucessor-nome')?.value ?? '';
    const partido = document.getElementById('sucessor-partido')?.value ?? 'Sem partido';
    return agir((p) => ({ ...p, governo: S.eleicaoSeguinte(p.governo, { tipo: 'sucessor', sucessor: { nome, partido } }) }));
  }
});

render();

})();
  </script>
  <script>
    // Diagnóstico: mostra erros em vez de deixar a tela de carregamento parada.
    (function () {
      function mostrar(texto) {
        var app = document.getElementById('app');
        if (app) app.innerHTML = '<section class="painel"><h2>O jogo não iniciou</h2><p>' + texto + '</p>' +
          '<p class="aviso">Tente abrir este arquivo no Google Chrome, Microsoft Edge ou Firefox (duplo clique). ' +
          'Se estiver numa pré-visualização, o JavaScript pode estar bloqueado.</p></section>';
      }
      window.addEventListener('error', function (e) {
        mostrar('Erro: ' + (e.message || 'desconhecido') + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        mostrar('Erro: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      setTimeout(function () {
        if (document.documentElement.dataset.jogo !== 'ok') {
          mostrar('O JavaScript não executou. O navegador pode estar bloqueando scripts neste arquivo.');
        }
      }, 4000);
    })();
  </script>
